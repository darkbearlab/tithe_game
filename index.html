<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<script>
"use strict";
/* =====================================================================
   CODENAME: HOMEWARD — 戰敗騎士的歸鄉之路（改編自 SLEEPER；單一英雄・無附身）
   原生 JS + Canvas 2D，零外部相依。
   分區： CONFIG / Math / Map / LoS+Vision / Camera / State /
          Possession / Combat(換彈/發散) / IdleAI / EnemyAI /
          Extraction / Movement / Input / Update / Render(迷霧)
   ===================================================================== */

/* =====================================================================
   CONFIG — 所有可調數值集中於此（全部為佔位值，待調平衡）
   ===================================================================== */
const CONFIG = {
  // --- 規格指定值 ---
  devLootRack: true,        // 開發測試：第0關地上陳列所有武器/道具（一般掉落＝撿進背包，休息關配裝）。發佈前設 false
  relicEnabled: false,      // 「比自己性命更重要的東西」＝原版機密檔案機制。Phase 0 關閉（勝負只看騎士），Phase 4 以歸鄉主題復活（主君遺物/軍旗…）
  idleAccuracyMult: 0.5,    // 待機精度倍率（待機基礎發散 = spreadBase / 此值，越低越散）
  idleReactionDelay: 0.4,   // 待機：看到敵人到開火的延遲 (s)
  idleFireRateMult: 0.7,    // 待機射速倍率（越低越慢）
  idleTap: { size: 3, gap: 0.55 },  // 點放(TAP)：每 burst 發數 / burst 後停頓秒數（讓 bloom 回復）
  unitHp: 100,
  // **整體節奏**（使用者定案：先通通拉長 1.2 倍）。這是單一旋鈕：
  //   時間類（前後搖、預告瞄準）× tempo＝更長；速度類（移動）÷ tempo＝更慢。
  //   套用點：spdOf（我方移動）、makeEnemy.moveSpeed（敵方移動）、startSwing（揮擊三段）、aimTimeOf（預告）。
  //   設回 1.0＝恢復原速。刻意不動士氣等純邏輯計時。
  // TITHE：Homeward 這裡是 1.2（刻意拉長 20% 的戰術節奏）。我們要往反方向走——
  // <1 ＝前後搖更短、移動更快。見 DESIGN.md §3。
  tempo: 0.9,
  introEnabled: true,       // 選完出身是否播序章（敗騎自屍山醒來→處決狼→遇敵兵→撤離）。關掉＝直接進路線圖。
  moveSpeed: 200,           // px/s（TITHE：DOOM 式的高基礎移速；Homeward 是 110「戰術化放慢」）
  // **騎士的瞄準沒有轉速上限**（使用者定案）：滑鼠指哪就朝哪，1:1。
  // 武器的差別靠前後搖 / 數值 / 詞條去分，不靠「這把轉得慢」——那只是隔一層讓操作變鈍，
  // 而且它和 DOOM 式的高速移動直接打架（跑得動但轉不過來＝手感在跟你吵架）。
  // 唯一還在的轉向限制是揮出去之後（CONFIG.melee.swingTurnRate），那不是武器差異，
  // 是「揮擊本身是一個承諾」。敵人的轉速另計，見 CONFIG.enemy.turnSpeed（那是 AI 的可讀性）。
  mouseSensitivity: 0.0035, // FPS 式滑鼠鎖定靈敏度（rad/px）
  /* dash（TITHE D3）——**完全免費**的迴避。DESIGN.md §3：
       防禦不該有成本，進攻才有回報。付費的防禦（格擋／奔跑）是你打出來之後才買得起的升級，
       而 dash 是永遠都在的保底——尤其是進房那一刻怒火還沒累積起來的時候。
     它同時是 B 型狙擊預告（§4.1）的正解：「在填滿前離開那條線」需要一個可靠的瞬間位移。
     i-frame 只佔動作的前段（iframeFrac）＝**穿過攻擊**要抓時機，不是無腦按了就無敵。 */
  dash: { dist: 200, dur: 0.15, cd: 0.8, iframeFrac: 0.75, trail: 6 },

  /* 出口的洞（TITHE D6 的第一塊，DESIGN.md §5.3）：
       清場那一刻，房間中央地板碎裂、一個洞打開，跳下去＝下一層。
     為什麼不是「清場即過關」：那樣最後一刀會直接把畫面切走，玩家連
     「我贏了」都還沒感覺到，也沒有撿東西、喘口氣的那一拍。
     **洞是一個動作**，不是一個判定——玩家要自己走過去跳下去。
     （洞口的三選一獎勵是 D6 的後半，還沒做。） */
  exit: { openDur: 0.8, radius: 38, drawR: 46 },

  /* ── 波次（DESIGN.md §1「不是無雙割草，而是不同個性鮮明的敵人穿插出現」）──────
     一間房不是「殺完六個人就結束」，而是好幾波，**每一波從不同的門進來**。
     這樣一間房才有形狀（開場 → 加壓 → 收尾），怒火的收支也才會跨越整場而不是每一小包各自結算。

     ⚠️ 這**不是** Homeward 的追兵。那套是「時間到了就無限湧出」的懲罰時鐘，
     方向和 TITHE 相反：清場後的閒逛已經由怒火衰退負責定價（§2.2），
     再加一個無限時鐘只會逼玩家速通、把「房間之間才做決策」（§5.4）壓掉。
     這裡拿回來的是它的**管線**（從別的點生成、直接 ENGAGED），不是它的觸發條件：
     **清光一波才來下一波，而且波數是有限的**。

     門一定要先亮起來再湧出（warn 秒）。§5.1 說房間沒有死角——
     背後無預警冒出一波是廉價的偷襲，不是難度。 */
  waves: {
    perRoom: 3,        // 每房幾波（含第一波）
    warn: 1.8,         // 門亮起到敵人湧出的秒數
    tierPerFloor: 1,   // 每深一層，抽遭遇的 tier 上限 +1（愈往下愈兇）
  },
  /* ── 下墜整備（DESIGN.md §5.4b）──────────────────────────────────────
     **三選一不限時、整備限時。** 兩段的性質不一樣：
       三選一是**獎勵時刻**（全揭露、兩秒的事）。加倒數會把它從深思變成反射——
       那不是同一種多巴胺，那是壓力。你不會對一個獎勵按碼表。
       整備是**雜務**（拿地上撿到的隨機劍去比身上那把）。一層六房下來它會變成苦工，
       而且袋子本來就要清空（§6.2b），所以「沒決定就沒了」不會讓你失去本來屬於你的東西。
     袋子空的時候直接落地——不要讓玩家盯著一個倒數的圈發呆。
     （若之後自動吸取讓袋子太大，把 kitTime 改成 base + 每件 N 秒即可，一行的事。） */
  descent: {
    kitTime: 30,     // 整備階段的秒數
    vacuum: 0.85,    // 跳下去之前把地上剩的東西全部捲進來的演出長度
  },
  /* ── 層與房間（DESIGN.md §5.5）────────────────────────────────────────
     一層 rooms 間房，打完往下一層。房間目前是**手刻輪播**（pool 裡的地圖輪流用）——
     程序生成要先把編輯器的「鋪滿網格點 + 自動整理連線」搬進遊戲端（尋路要 waypoint 圖），
     那是獨立的一塊工，硬塞進來會讓這一步拖很長而且測不到重點。 */
  floor: {
    rooms: 6,
    pool: ['alpha', 'bravo', 'field', 'lanes', 'outpost'],
  },

  sprint: { mult: 1.9 },    // Shift 奔跑倍率（固定；不再隨負重遞減，見 sprintMult）
  // 武器數值移至下方 WEAPONS 目錄（可指派、未來可換）

  squadSize: 1,             // TITHE：教廷送**一個人**進地獄。場上永遠只有騎士（見 startMission）
  // 跨關回復：每場戰鬥開始時，存活成員「缺血」回復的比例。
  // 1.0＝自動全補（目前行為）；0＝殘血照舊帶入；0.5＝回復一半缺口。當前血量已跨關攜帶，調此鈕即生效。
  interMissionHealFrac: 1.0,

  // 共用倉庫 / 裝備 / 搜刮（meta 庫存層；佔位旋鈕）
  loadout: {
    slotsPerMember: 2,             // 倉庫容量 = 生還人數 × 此值（喚醒/陣亡即時改變）
    abilitiesCountTowardCap: true, // 技能是否佔倉庫格（實測太擠可關）
    scavengeChoices: 3,            // 搜刮抽選數（三選一，用 agency 蓋過純 RNG）
  },
  // 彈藥：每武器類別一個共用儲備（reserve）。本階段「不咬人」＝寬裕值，正常一場打不完。
  // pistol＝底線武器，彈藥視為無限、不納入分配。
  ammo: { stockStart: 600, defaultAlloc: 240, salvageAlly: 120, salvageEnemy: 60, subsonicStart: 18 },   // subsonicStart＝消音武器(silent)的稀少亞音速彈儲備（限制無聲擊殺頻率）
  pickupRadius: 26,                // 騎士走到掉落物多近會撿進臨時背包

  // 地形 / 互動（門、按鈕、低矮牆）
  interactRadius: 40,             // 互動(開關門/按鈕)距離；門以「到門線段最近點」量距，整扇門寬都好按
  // 低矮牆＝掩體：玩家穿越減速、敵人視為實體繞行、不擋視線、子彈「遠距機率擋／貼牆可越射」
  lowWall: { slow: 0.3, touchR: 12, closeRange: 90, blockChance: 0.55 },
  // 草叢：踏進去＝固定減速。TITHE 只保留這個地形效果——
  // 「躲進草叢＝隱形」隨潛行一起移除了（C3），「越重越難行」隨負重一起移除了。
  bush: { slow: 0.25 },
  // 牆體厚度（px，全域固定）：渲染描邊寬＝此值；子彈/視線阻擋以「離中心線 ≤ 半厚」判定（撞渲染牆面而非中心線）。
  // 40px=1公尺，故 8px≈20cm（室內牆）。承重牆在編輯器平行畫兩條即可，不在資料上分型。移動退避仍走單位半徑（已比牆厚）。
  wallThick: 8,
  // 重裝敵人裝甲：高機率「整發擋下」非穿甲攻擊；穿甲(pierce)越高越能無視。
  // 有效擋格率 = blockChance × (1 − weapon.pierce)。血量與一般敵人相同，靠這條形成質差。
  /* ── 裝甲（使用者定案，全部重寫）────────────────────────────────────
     **沒有機率了。** 舊版是「85% 整發彈開 / 15% 全額」，倍率算起來很漂亮但體感是
     「砍四刀什麼都沒發生，然後三刀就死」——在一個講讀招與節奏的遊戲裡，那是雜訊。

     現在只有兩條算式，一條規則、兩個來源：

       傷害   = dmg × (1 − armor × flatResist)              ← 純比例
       體幹傷 = poiseDmg × (1 + armor × pierce × antiGain)  ← 反裝甲只在「有甲」時發威

     第二條是整個設計的重點：**反裝甲加的是體幹傷害，不是傷害。**
     加傷害的話，沒帶鈍器就是「打不死他」＝一道硬牆；加體幹傷害則是
     「殺得死，但很慢、而且開不出處決窗」——處決是唯一的回血，所以代價是
     **這場仗要用血去換**，不是打不過去。那正好是 §2.8 難度契約的形狀。
     而且 armor 為 0 時括號恆為 1 ⇒ **鎚打雜兵就是普通的鎚**，不必寫特例。

     `pierce` 因此改義成「反裝甲程度」，沿用每把武器已經調好的值：
     鎚 0.95 / 石中劍 1.0 / 法杖 0.55 / 槍 0.55 / 劍 0.35 / 斧 0.30 / 短刀 0.10。

     **armor 的兩個來源**：敵人天生穿著（ENEMY_TYPES.armor）；騎士**從來沒有人間的甲**，
     只有結晶臨時堆疊出來的（見 CONFIG.crystal）。同一條算式，所以敵人的鎚
     砸穿你辛苦疊起來的殼是自然發生的，不需要特例。 */
  armor: {
    flatResist: 0.55,      // 減傷斜率：armor 1.0 ＝ −55% 傷害
    antiGain: 1.6,         // 反裝甲的體幹加成斜率：armor 1.0 × pierce 0.95 ⇒ 體幹傷 ×2.5
    resistCap: 0.75,
    weakTag: 0.45,         // pierce 低於此值打有甲目標＝跳「反彈」（提示這一擊低效）
    blockChance: 0.85,     // 敵人 ENEMY_TYPES 拿來當「重裝」的 armor 值（沿用舊名，避免動到兵種表）
  },
  /* ── 結晶（騎士唯一的護身）──────────────────────────────────────────
     凡間的裝甲在地獄不值一提，所以騎士身上**從來沒有人間定義的甲**。
     撐住他的是仇恨、怒火，和聖血的殘餘——以及那些在地獄裡與聖血共鳴後結出的**結晶**。
     機制上就是：**擊殺 → 疊一層裝甲 → 隨時間掉**。

     它和怒火刻意分工，兩條資源各講一件事：
       **怒火＝你付得起什麼**（格擋／奔跑／技能／大絕招）
       **結晶＝你挨得住什麼**（殺敵累積、時間衰退）
     所以「怒火比例 → 減傷」那條整個拿掉了——連帶把 §2.3 那段
     「這條本來是死亡螺旋，之所以安全完全是因為……」的耦合警語一起消掉。

     衰退規則和怒火一致：**清場那一刻凍結、跨房保留**（上一房的血還沒乾）。
     每房從零開始重新裸奔是純粹的 feel bad——那是在懲罰一個還沒做錯事的瞬間。 */

/* ── 怒火（wrath）——取代耐力的唯一資源（DESIGN.md §2.2–2.3）───────────────
   三條規則決定它的形狀，動任何一條之前先回去讀設計文件：
     ① **開場滿**：聽完禱文、想起那個不曾回來的父親，騎士是滿身怒火跨進地獄的。
        第一房不需要暖機，而且一進去就有一發大絕招可以放。
     ② **攻擊不花怒火**：push-forward 的前提是你永遠打得動。花費只有格擋/奔跑/技能/大絕招。
     ③ **不隨時間回、只隨時間退**：時間回復會讓「退開等回氣」變成最優解（那就是站著不打，
        只是換了個名字）；時間衰退則讓等待永遠是虧的——想留住怒火只有繼續打。

   衰退**只在房裡還有活著的敵人時**跑，清場那一刻凍結。換房不另外扣：
   那是純粹的 feel bad，而且會懲罰仔細撿東西的玩家。打得快的人帶著高怒火進下一房＝獎勵。

   ⚠️ 「怒火高 → 減傷」（dr*）的形狀本來是死亡螺旋，它之所以安全**完全是因為怒火靠打人回復**：
   低怒火會逼你進攻，進攻就回怒火，系統自我修正。哪天若改成時間回復，減傷這條必須同時拿掉。

   調值目標寫成一句話：**大部分時間在中段徘徊，偶爾見底。**
   整場貼著上限＝花費（cost*）太便宜，不是衰退太慢——衰退只負責傳達「不出手＝慢性繳械」，
   不負責製造稀缺。永遠的保底手段是免費的 dash。 */
CONFIG.wrath = {
  max: 100,                // 上限（開場即為此值）
  decay: 2.2,              // 戰鬥中的衰退 /s（房裡還有活敵人時才跑；清場凍結）
  /* **最後一次回怒之後 decayDelay 秒才開始扣。**
     實測回饋：沒有這個緩衝的話「不是純 aggro 就根本累積不起來」——
     連段中每一刀拿到的怒火會在下一刀之前就被磨掉一部分，等於只有貼身連打才存得到東西。
     緩衝把「不出手＝慢性繳械」這個訊息保留下來（放著不打照樣掉），

  decayDelay: 1.3,

  ultRadius: 200,          // 大絕招半徑

/* =====================================================================
   Hooks — 戰鬥事件匯流排（HOMEWARD roguelite build 的地基）
   之後的聖物/祝福/詛咒/被動全部走這裡：內容＝「訂閱事件 + 改 ctx」，引擎不再為每個效果開洞。
   引擎在下列時機 fire（ctx 內容標在各觸發點；u 恆為「事件主體」）：

     attackStart   出手（近戰揮擊成立/遠程擊發）        { u, W, melee }
     attackHit     打中別人                              { u, t, dealt, melee, blocked, backstab, armorDeflect }
     hurt          被打中且實際扣血                      { u, from, dealt, melee, blocked }
     blockHit      盾格擋下（非招架）                    { u, from }
     parry         招架成功                              { u, from }
     armorDeflect  身上的甲彈開一擊                      { u, from }
     interrupt     前搖被打斷                            { u(被斷者), by }
     poiseLow      體幹跌破門檻（每次跌破觸發一次）      { u, frac }
     poiseBroken   體幹破（大硬直開始）                  { u, by }
     hpLow         生命跌破門檻（每次跌破觸發一次）      { u, frac }
     wrathEmpty    怒火不足（想放技能/大絕招但放不出來）  { u }
     beforeDeath   即將死亡（**可攔截**）                { u, killer, prevented, reviveHp }
                     handler 設 ctx.prevented=true ＝免死，以 ctx.reviveHp（預設 1）復活
     death         死亡定案                              { u, killer }
     kill          擊殺別人                              { killer, victim, elite, boss }
     missionStart  一場戰鬥開始                          { }
     missionEnd    一場戰鬥結束                          { win }

   慣例：handler 全部包 try/catch（一個壞掉的內容不能拖垮戰鬥）；
   「每場一次」的狀態記在 Hooks.mission（missionStart 自動清空）。
   ===================================================================== */
const Hooks = {
  _h: new Map(),          // event → Map(id → fn)
  mission: {},            // 每場一次的旗標（missionStart 清空）
  on(event, id, fn) { if (!this._h.has(event)) this._h.set(event, new Map()); this._h.get(event).set(id, fn); },
  off(id) { for (const m of this._h.values()) m.delete(id); },
  fire(event, ctx) {
    const m = this._h.get(event); if (!m) return ctx;
    for (const [id, fn] of m) { try { fn(ctx); } catch (e) { console.warn('hook', event, id, e); } }
    return ctx;
  },
};
CONFIG.hooks = { hpLowFrac: 0.35, poiseLowFrac: 0.35 };   // hpLow / poiseLow 的觸發門檻（跌破一次觸發一次，回到門檻上重新武裝）

/* 聖物（RELICS）— 吃 Hooks 的內容目錄。先放一個把「復活」通道打通的示範；
   之後的 build 內容（事件獎勵/商店/Boss 掉落）都照這個形狀加。 */
const RELICS = {
  secondwind: {
    name: '不屈', rarity: 'rare', desc: '每場一次：致死傷害改為保留 1 HP',
    hooks: {
      beforeDeath(ctx) {
        const k = knight();
        if (!k || ctx.u !== k) return;                       // 只保騎士
        if (Hooks.mission.secondwind) return;                // 每場一次
        Hooks.mission.secondwind = true;
        ctx.prevented = true; ctx.reviveHp = 1;
      },
    },
  },
};
let knightRelics = new Set();   // 騎士持有的聖物 id（roguelite：run 中撿、run 結束清）
function applyRelicHooks() {    // 重掛（撿到/失去聖物後呼叫）
  for (const rid of Object.keys(RELICS)) Hooks.off('relic:' + rid);
  for (const rid of knightRelics) {
    const r = RELICS[rid]; if (!r) continue;
    for (const [ev, fn] of Object.entries(r.hooks || {})) Hooks.on(ev, 'relic:' + rid, fn);
  }
}

  for (const id of OATH_IDS) { const o = OATHS[id]; if (o.kind === 'bound' && o.boundTo === originId) return id; }

};
const oathUnlocked = (id) => !!(meta.unlockedOaths && meta.unlockedOaths[id]);
const oathFreeSlots = () => CONFIG.oath.baseSlots + upgLevel('oathSlots');   // 自由槽數＝基礎 + 升級「誓約」
// 自選誓約解析：meta.oathLoadout → 過濾成「已解鎖、且依 slotCost 塞得進自由槽」的清單（保序）
function resolvedFreeOaths() {
  const out = []; let used = 0; const cap = oathFreeSlots();
  for (const id of (meta.oathLoadout || [])) {
    const o = OATHS[id];
    if (!o || o.kind !== 'free' || !oathUnlocked(id)) continue;
    const cost = o.slotCost || 1;
    if (used + cost > cap) continue;
    out.push(id); used += cost;
  }
  return out;
}
let activeOaths = new Set();                    // 本場生效的誓約 id（綁定 + 已裝上的自選）——非騎士系統查詢用
const hasOath = (id) => activeOaths.has(id);
// 套用騎士的誓約（綁定 + 自選 loadout）。在 makePlayer 造好騎士後對騎士呼叫＝每場重套（欄位每場重建）；
// 同時重建 activeOaths（騎士＝ roster[0]＝每場最先造，故扈從/戰鬥查 hasOath 時已就緒）。
function applyOathLoadout(k) {
  activeOaths = new Set();
  if (!k) return;
  k.oaths = [];
  const apply = (id) => { const o = OATHS[id]; if (!o) return; if (o.mods) o.mods(k); k.oaths.push(id); activeOaths.add(id); };
  const b = boundOathFor(k.originId);
  if (b) apply(b);
  for (const id of resolvedFreeOaths()) apply(id);
}

   ARTS — **術／技藝：自由槽位(3/4)的唯一內容表**（Phase 2-B，使用者提案）

   所以這張表只描述「效果是什麼」，不描述「你憑什麼用它」。後者叫**載具(carrier)**：

     卷軸 scroll   有限次數、**即時**（沒有前搖、不吃怒火）＝救命按鈕
     習得 learned  無限次數、**有前搖且吃怒火、會被打斷**＝可持續的工具
                   （**沒有 CD**：DESIGN §2.3——玩家只看一條資源條，
                     而且技能的施放頻率由你打得多兇決定，技能因此被接進戰鬥迴圈）

   `learnable:false` ＝這東西只有卷軸那一欄。陶罐、藥、箭袋本來就學不會，
   這條旗標讓「投擲道具」與「魔法」共用同一張表而不彆扭。
   `kind` 直接對應既有管線（projectile→彈道／thrown→投擲／self→自身），沒有新的戰鬥碼。
   ===================================================================== */

const upgDef = (id) => UPGRADES.find(u => u.id === id);
const upgLevel = (id) => (meta.upgrades && meta.upgrades[id]) || 0;
const upgVal = (id) => { const u = upgDef(id); return u ? u.per * upgLevel(id) : 0; };   // 目前總加成
const upgCost = (id) => { const u = upgDef(id); return u ? u.cost * (upgLevel(id) + 1) : 0; };   // 下一級成本（遞增）
const upgMaxed = (id) => { const u = upgDef(id); return !u || upgLevel(id) >= u.max; };
function buyUpgrade(id) {
  const u = upgDef(id); if (!u || upgMaxed(id)) return false;
  const c = upgCost(id); if ((meta.honor | 0) < c) return false;
  meta.honor -= c; meta.upgrades[id] = upgLevel(id) + 1; saveMeta(); return true;
}
// 戰後獎勵（使用者定案：升等移除後把「清關榮譽」從 run-end 挪到打贏當下＝即時、看得見的一幕）。
// **這是之後接 run 內經濟/道具的單一鉤子**——現在先發小額榮譽墊檔，改內容只改這裡。
const honorMul = () => 1 + upgVal('honor') + (hasOath('plunder') ? CONFIG.oath.plunderHonor : 0);   // 榮譽加成＝meta「榮光」+ 誓約「掠奪」
function grantCombatReward() {
  const r = Math.round(CONFIG.meta.honorPerMission * honorMul());   // meta 升級「榮光」+ 誓約「掠奪」：榮譽獲得加成
  meta.honor += r; saveMeta();
  missionMsg = `戰功 · 榮譽 +${r}`;
  Hooks.fire('combatReward', { honor: r });
  return r;
}
function checkOathUnlocks(rs) {   // run 結束查自選誓約解鎖（rs＝本局+生涯合併快照）；回傳本次新解鎖的 id 陣列
  const newly = [];
  for (const id of OATH_IDS) {
    const o = OATHS[id];
    if (o.kind !== 'free' || !o.unlock || meta.unlockedOaths[id]) continue;
    if (o.unlock(rs)) { meta.unlockedOaths[id] = true; newly.push(id); }
  }
  return newly;
}
let lastOathUnlocks = [];   // 上一 run 新解鎖的自選誓約（RUNEND 顯示用）
function metaOnRunEnd(won) {   // run 結束結算：榮譽 + stats + 里程碑/誓約自動解鎖 + 存檔
  meta.stats.runs = (meta.stats.runs || 0) + 1;
  const mi = (typeof missionIndex === 'number' ? missionIndex : 0);
  meta.stats.missions = (meta.stats.missions || 0) + mi;
  const M = CONFIG.meta, rs = runStats || { events: 0, kia: 0 };
  meta.stats.eliteKills = (meta.stats.eliteKills || 0) + (rs.eliteKills || 0);   // 生涯斬將累計（誓約「復仇」解鎖用）
  const missionAwarded = M.honorPerMission * mi;        // 清關榮譽已在打贏當下即時發放（grantCombatReward），這裡不再重複計入 gross
  const winPart = won ? M.honorWin : 0;                  // 通關保底
  const eventPart = M.honorPerEvent * (rs.events || 0);  // 事件記錄加分
  const gross = winPart + eventPart;
  const rawPenalty = M.honorPerKIA * (rs.kia || 0);
  const penalty = Math.min(rawPenalty, Math.floor((missionAwarded + gross) * M.kiaPenaltyCapFrac));   // 封頂仍以「整局榮譽」為基準＝扣分幅度與舊版一致（總量不變）
  const gain = Math.round(Math.max(0, gross - penalty) * honorMul());   // meta 升級「榮光」+ 誓約「掠奪」：run-end 榮譽也吃加成
  meta.honor += gain;
  lastHonorBreakdown = { mi, missionAwarded, winPart, eventPart, events: rs.events || 0, kia: rs.kia || 0, penalty, gain, won };
  if (won) { meta.stats.wins = (meta.stats.wins || 0) + 1; for (const r of (roster || [])) if (r && r.classId) meta.stats.winArch[r.classId] = (meta.stats.winArch[r.classId] || 0) + 1; }
  const snap = { won: !!won, kills: rs.kills || 0, eliteKills: rs.eliteKills || 0, missions: mi, events: rs.events || 0, kia: rs.kia || 0,
                 lifetimeElite: meta.stats.eliteKills || 0, lifetimeMissions: meta.stats.missions || 0, wins: meta.stats.wins || 0, runs: meta.stats.runs || 0 };
  lastOathUnlocks = checkOathUnlocks(snap);
  checkMilestoneUnlocks(); saveMeta();
}

function genRoadmap() {   // 每局程序生成（在 srandSeed 後呼叫）；依 runAct 分流（目前先分王節點的顯示身分，內容池之後接）
  const C = CONFIG.roadmap;
  const cols = Math.max(3, C.cols | 0), rows = Math.max(1, C.rowsPerCol | 0), body = cols - 1;
  const cellSet = {}, edgeSet = new Set(), key = (c, r) => c + ',' + r;
  for (let p = 0; p < C.pathCount; p++) {   // 路徑聯集：每條每欄選一列、連到下一欄鄰近列
    let r = Math.floor(srand() * rows); cellSet[key(0, r)] = true;
    for (let c = 1; c < body; c++) {
      const nr = Math.max(0, Math.min(rows - 1, r + (Math.floor(srand() * 3) - 1)));
      cellSet[key(c, nr)] = true; edgeSet.add(key(c - 1, r) + '>' + key(c, nr)); r = nr;
    }
  }
  const idOf = {}, nodes = []; let id = 0;
  for (let c = 0; c < body; c++) for (let r = 0; r < rows; r++) if (cellSet[key(c, r)]) { idOf[key(c, r)] = id; nodes.push({ id, col: c, row: r, type: 'COMBAT' }); id++; }
  const bossId = id++, bossRow = Math.floor((rows - 1) / 2);
  nodes.push({ id: bossId, col: cols - 1, row: bossRow, type: 'COMBAT', boss: true });   // 單一王（人人必達）
  const edges = [];
  for (const e of edgeSet) { const ab = e.split('>'); edges.push([idOf[ab[0]], idOf[ab[1]]]); }
  for (let r = 0; r < rows; r++) if (cellSet[key(body - 1, r)]) edges.push([idOf[key(body - 1, r)], bossId]);   // 倒數第二欄 → 王
  /* 休息牆（使用者定案）：每隔 restEvery 欄整欄設為 REST。因為每條路徑在每一欄都恰有一個節點，
     整欄 REST ＝**不管走哪條路，都在相同深度必經一次休息**（未必收束到同一格，而是同一進展深度）。
     王前一欄若不與階梯休息相鄰，也補一道＝整補後上王。 */
  const restEvery = Math.max(1, (C.restEvery | 0) || 2);
  const restWallCols = new Set();
  for (let c = restEvery; c <= body - 1; c += restEvery) restWallCols.add(c);
  if (!restWallCols.has(body - 1) && !restWallCols.has(body - 2)) restWallCols.add(body - 1);
  for (const n of nodes) {
    if (n.boss || n.col === 0) n.type = 'COMBAT';        // 首欄＝COMBAT、王＝COMBAT
    else if (restWallCols.has(n.col)) n.type = 'REST';   // 休息牆：整欄休息（每條路必經）
    else n.type = roadWeightedType();                    // 中段加權隨機
  }
  // REST 節點的隱藏內容（camp/tutor/…）：進入才揭曉（見 REST_SITES / roadSiteKnown）
  for (const n of nodes) if (n.type === 'REST') n.site = pickSite();
  roadAssignMaps(nodes);
  const rm = { start: nodes.filter(n => n.col === 0).map(n => n.id), nodes, edges };
  roadmap = validateRoadmap(rm) ? rm : FALLBACK_ROADMAP;
  roadmap.act = (runAct === 2 ? 2 : 1);                     // 這張圖屬於哪一幕
  const bn = roadmap.nodes.find(n => n.boss); if (bn) bn.bossName = ACT_INFO[roadmap.act].boss;   // 王節點的顯示身分（國界/莊園）
  buildRoadAdj();
}

  const t = (qpx * sy - qpy * sx) / rxs;

function segSegDist(p1, p2, p3, p4) {

  const c0 = { x: r.x, y: r.y }, c1 = { x: x2, y: r.y }, c2 = { x: x2, y: y2 }, c3 = { x: r.x, y: y2 };
  return segIntersect(a, b, c0, c1) || segIntersect(a, b, c1, c2) || segIntersect(a, b, c2, c3) || segIntersect(a, b, c3, c0);

function rayRectT(o, d, r) {

  const c0 = { x: r.x, y: r.y }, c1 = { x: x2, y: r.y }, c2 = { x: x2, y: y2 }, c3 = { x: r.x, y: y2 };
  let best = null;
  for (const [p, q] of [[c0, c1], [c1, c2], [c2, c3], [c3, c0]]) { const t = raySegT(o, d, p, q); if (t != null && (best == null || t < best)) best = t; }

    if (t != null && t < best) best = t;

  for (const dr of MAP.doors) {           // 關閉的門也截斷視錐（低矮牆不擋視線）
    if (dr.open) continue;
    const t = raySegT(o, d, { x: dr.x1, y: dr.y1 }, { x: dr.x2, y: dr.y2 });
    if (t != null && t < best) best = t;
  }
  for (const z of (MAP.areas || [])) {    // 擋視線的區域(實體/掩體/煙幕)也截斷視錐
    if (!aMat(z).los) continue;
    const t = rayRectT(o, d, z);
    if (t != null && t < best) best = t;
  }

        '',
        '前方有名敵兵正在搜刮屍體——解決他。',
      ] },
    { kind: 'do', fn: () => { const s = cutscene.soldier; if (s) { s.introFrozen = false; s.state = 'ENGAGED'; s.facing = Math.PI; } } },
    { kind: 'sub', text: '擊敗敵兵' },
    { kind: 'gate', on: 'clear' },

  else if (b.kind === 'sub') cs.subtitle = b.text;
  else if (b.kind === 'reveal') cs.reveal = b.to;   // 聚光區（null＝回一般迷霧）

  else if (b.kind === 'shoot') { cs.lock = true; cs.line = null; cs.subtitle = b.text || '按下左鍵攻擊'; }

        b._fired = true;

        else { p.muzzle = 0.05; spawnMuzzleBullet(p, v); }                        // 遠程：槍口火光

/* =====================================================================
   休息關 meta 流程：共用倉庫(有上限) + 臨時背包整理 + 二選一(搜刮/收留) + 配裝/彈藥分配

const RARITY_WEIGHT = { common: 60, uncommon: 25, rare: 12, epic: 4, legendary: 1 };

// 掉落武器的精良度（＝強化 charge 預算，本身不加數值）：擲一個獨立的精良度等級，與武器本身的基礎稀有度取高。

// 撿到／取得一把武器的倉庫物件（帶擲出的精良度）；q 給定時沿用（拾取既有實例用）。附「★精良度」標籤給收場訊息。
const lootWeaponEntry = (id, q) => ({ kind: 'weapon', id, quality: q != null ? q : dropWeaponQuality(id) });
const qualityTag = (q) => (q >= 2 ? `（${'★'.repeat(q)} 精良${q}）` : '');   // 精良1＝粗製，不特別標；精良2+ 才提示「這把值得帶去強化」

// --- 倉庫容量 ---
const warehouseCap = () => roster.length * CONFIG.loadout.slotsPerMember;

// --- 軍械庫節點：三選一拿 武器/裝備/技能/道具 → 倉庫 → 回路線圖（不進戰鬥、不耗時）---
function enterArmory() { scene = 'ARMORY'; releasePointer(); armoryOffers = rollArmory(CONFIG.loadout.scavengeChoices); }
function rollArmory(n) {
  const weapon = () => { const id = rollLootWeapon(), W = WEAPONS[id], q = dropWeaponQuality(id); return { type: 'weapon', id, quality: q, label: `武器 · ${W.name}${q >= 2 ? ' ' + '★'.repeat(q) : ''}`, color: rarityColor(W.rarity) }; };
  const equipO = () => { const id = rngPick(availPool('equip', LOOT_EQUIP_IDS)), E = EQUIPMENT[id]; return { type: 'equip', id, label: `裝備 · ${E.name}（${E.rarity}）`, color: '#9fd0e0' }; };
  const ability = () => { const id = rngPick(availPool('ability', LOOT_ABILITY_IDS)), A = ABILITIES[id]; return { type: 'ability', id, label: `技能 · ${A.name}`, color: '#c0a0ff' }; };
  const itemO = () => { const id = rngPick(LOOT_ITEM_IDS), I = ITEMS[id]; return { type: 'item', id, label: `道具 · ${I.name}`, color: '#ffd27d' }; };

function armoryPick(i) {

/* ── 導師節點（使用者定案）──────────────────────────────────────────────
   卷軸的取捨在這裡收斂：**現在用掉它，還是燒掉它換永久**。
   導師節點在路線圖上跟其他節點一樣**事先就看得見**（本來就會畫出 type/glyph），
   所以「這條路上有導師」是分岔時的判斷依據，不是走到才知道的驚喜。

}
function tutorSetMode(m) { if (scene !== 'TUTOR') return; tutorMode = m; tutorAffixWep = null; tutorMsg = ''; }
// 加詞條：先選武器（enhanceTargets，與鐵匠同源），再選詞條（TUTOR_AFFIX_IDS）
function tutorPickWeapon(i) { if (scene !== 'TUTOR' || tutorMode !== 'affix') return false; if (!enhanceTargets()[i]) return false; tutorAffixWep = i; tutorMsg = ''; return true; }

  if (chargesFree(t.inst) < (A.charges || 1)) { tutorMsg = `${A.name}：格數不夠（要 ${A.charges} 格，剩 ${chargesFree(t.inst)}）`; return false; }

/* ── 鐵匠 site（S2 UI）：強化你有的武器（鋒利/平衡，隨機）───────────────────
   目標＝騎士當前配的兩把主手（roster 槽 1/2）＋倉庫裡的武器。強化直接改來源的 enh 陣列
   （roster 欄位或倉庫條目），因為陣列是參照＝就地生效、跨關保留。免費、只受精良度(格數)限制。 */

// --- 進入休息關：整理臨時背包（彈藥折算進儲備、item 進倉庫 haul）---
function enterRest(tutorial = false) {

}

// --- 搜刮＝純整補（零風險、無抉擇；風險集中在事件格）---
// 機制：保底抽 1 類型 + 機率追加類型；每類型抽內容(rarity 加權)，彈藥類型可給複數。純 RNG(之後可改吃種子)。
const RESUPPLY_CATS = ['ammo', 'ammo', 'ammo', 'weapon', 'weapon', 'equip', 'equip', 'item', 'item', 'ability'];   // 加權袋（彈藥較常見）
function rollResupply() {
  const got = [], cats = [rngPick(RESUPPLY_CATS)];
  if (srand() < 0.5) cats.push(rngPick(RESUPPLY_CATS));    // 機率追加第二類
  if (srand() < 0.22) cats.push(rngPick(RESUPPLY_CATS));   // 小機率第三類
  const seen = {};
  for (const c of cats) {
    if (c === 'ammo') {   // 彈藥：1~2 個武器類別各一份備彈（可複數）
      const ids = WEAPON_IDS.filter(id => !isInfiniteAmmo(id) && !WEAPONS[id].silent);
      const k = 1 + (srand() < 0.5 ? 1 : 0);
      for (let j = 0; j < k; j++) { const id = rngPick(ids), amt = WEAPONS[id].magazine * (2 + Math.floor(srand() * 3)); ammoStock[id] = (ammoStock[id] || 0) + amt; got.push(`${WEAPONS[id].name}彈+${amt}`); }
    } else if (seen[c]) { const ids = WEAPON_IDS.filter(id => !isInfiniteAmmo(id) && !WEAPONS[id].silent), id = rngPick(ids), amt = WEAPONS[id].magazine * 2; ammoStock[id] = (ammoStock[id] || 0) + amt; got.push(`${WEAPONS[id].name}彈+${amt}`); }   // 同類型重抽→改給彈藥(不重複物品)
    else if (c === 'weapon') { const id = rollLootWeapon(); const e = lootWeaponEntry(id); warehouse.push(e); got.push(WEAPONS[id].name + qualityTag(e.quality)); }
    else if (c === 'equip') { const id = rngPick(availPool('equip', LOOT_EQUIP_IDS)); warehouse.push({ kind: 'equip', id }); got.push(EQUIPMENT[id].name); }
    else if (c === 'item') { const id = rngPick(LOOT_ITEM_IDS); giveItemStack(id); got.push(ITEMS[id].name + ' ×' + ITEM_STACK_MAX); }
    else if (c === 'off') { const id = rngPick(availPool('off', LOOT_OFF_IDS)); warehouse.push({ kind: 'off', id }); got.push(OFFHANDS[id].name); }

   而呼叫端寫的是 `const r = useX(u); if (!r) { 還原 }` → r 恆為 undefined ＝**每次都還原**。

function useFreeSlot(u, i) { return castArt(u, i); }
const artWrathCost = (u, A) => Math.round(((A && A.wrathCost) || 0) * ((u && u.artCostMul) || 1));   // 誓約「咒能」：成本打折
const artUsesOf = (sl) => (sl && sl.type === 'item' ? (sl.count || 0) : Infinity);
// 這個槽位現在按得下去嗎（HUD 用；不含「正在施法」等瞬時狀態）
function artReady(u, sl) {
  if (!sl || sl.kind !== 'free' || !sl.id || !artOf(sl.id)) return false;
  return sl.type === 'ability' ? (u.wrath || 0) >= artWrathCost(u, artOf(sl.id)) : artUsesOf(sl) > 0;
}
function castArt(u, i) {
  const sl = u && u.slots && u.slots[i];
  if (!sl || sl.kind !== 'free' || !sl.id) return false;
  const A = artOf(sl.id); if (!A) return false;
  // **騎士專屬**（使用者定案）：AI 不做資源管理——給了成本與次數，扈從只會亂放或永遠不放，
  // 就跟「扈從有怒火卻不知道要打人回怒」是同一個坑。
  if (u.id !== KNIGHT_ID || u.state !== 'CONTROLLED') return false;
  if (u.staggerT > 0 || u.cast || u.swing) return false;
  const learned = sl.type === 'ability';
  if (learned && !A.learnable) return false;   // 陶罐學不會
  if (learned) {
    if (!hasWrath(u, artWrathCost(u, A))) { failWrath(u); return false; }   // 怒火不足＝放不出來（無 CD，資源就是唯一的閘門）
    u.cast = { slot: i, artId: resolveArt(sl.id), t: 0, dur: (A.castTime || 0.4) * (u.castMul || 1) };   // 前搖開始，會被打斷（誓約「咒能」：castMul 縮短）
    u.blocking = false; u.blockT = null;
    Hooks.fire('castStart', { u, artId: u.cast.artId, art: A, carrier: 'learned' });
    return true;
  }
  if (!(sl.count > 0)) return false;
  sl.count--;                                   // 卷軸：即時生效，用完就沒了
  applyArt(u, A);
  Hooks.fire('cast', { u, artId: resolveArt(sl.id), art: A, carrier: 'scroll' });
  return true;
}
// 前搖推進：走完＝扣怒火、生效。被打斷在 damageUnit 裡（與揮擊同一處）。
// **怒火在前搖走完才扣**＝被打斷不會白花錢（打斷的懲罰是失去節奏，不是罰款）。
function tickCast(u, dt) {
  if (!u.cast) return;
  u.cast.t += dt;
  if (u.cast.t < u.cast.dur) return;
  const artId = u.cast.artId, sl = u.slots && u.slots[u.cast.slot], A = ARTS[artId];
  u.cast = null;
  if (!sl || !A) return;
  spendWrath(u, artWrathCost(u, A));
  applyArt(u, A);
  Hooks.fire('cast', { u, artId, art: A, carrier: 'learned' });
}
// 效果本體：敵我共用一套管線，載具只決定「你憑什麼用它」
function applyArt(u, A) {
  if (A.heal) { u.hp = Math.min(u.maxHp, u.hp + A.heal); spawnHeal(u.pos); }
  if (A.refill) { u.ammoInMag = unitMag(u); if (!isInfiniteAmmo(u.weaponId)) u.ammoReserve += unitMag(u) * 2; spawnPickup(u.pos); }
  if (A.buff) { u.buffT = A.buff.dur; u.buffMove = A.buff.moveMul || 1; u.buffFire = A.buff.fireRateMul || 1; spawnHeal(u.pos); }
  if (A.grenade) throwGrenade(u, A.grenade);
  if (A.flash) throwFlash(u, A.flash);
  if (A.bolt) castBolt(u, A.bolt);
}
/* 火矢：走**既有的彈道管線**（同一個 bullets 陣列＝同一套牆面/單位碰撞、
   同一套友軍誤傷、同一套穿甲）。高 pierce ＝專門對付披甲士。 */
function castBolt(u, B) {
  const a = u.facing;
  bullets.push({
    x: u.pos.x + Math.cos(a) * (u.radius + 2), y: u.pos.y + Math.sin(a) * (u.radius + 2),
    vx: Math.cos(a) * B.projSpeed * CONFIG.juice.bulletSpeedMul, vy: Math.sin(a) * B.projSpeed * CONFIG.juice.bulletSpeedMul,
    dmg: B.dmg, faction: u.faction, range: B.range, traveled: 0,
    ox: u.pos.x, oy: u.pos.y, pierce: B.pierce || 0, tracer: true, owner: u,
  });
  for (let i = 0; i < 10; i++) particles.push(mkPart(u.pos, 160, 0.35, i % 2 ? '#ffd27a' : '#ff8a3a'));
  addShakeAt(u.pos, CONFIG.juice.shakeKill);
  Sfx.play('shot', u.pos);
}
/* =====================================================================
   近接戰鬥（HOMEWARD Phase 1）
   揮斬＝三段狀態機：WINDUP(前搖，可被打斷) → ACTIVE(判定窗，每幀掃前方扇形) → RECOVER(後搖)。
   接在 fireUnit 的最前面＝**所有既有開火路徑（玩家手動 / 扈從 overwatch / 敵人 AI）自動共用**，
   不必為玩家寫一條專用碼；Phase 2 敵種中世紀化只要把 ENEMY_TYPES.weaponId 換成近接武器即可。
   ===================================================================== */
/* ── 體幹 / 怒火 / 攻擊權 ─────────────────────────────────────────────
   兩條資源解決兩個獨立的問題：
     體幹（poise）＝「被打有代價」：扣光＝大硬直＋處決窗 → 亂 trade 會被直接處決
     怒火（wrath）  ＝「容錯有價格」：格擋/奔跑/技能/大絕招要錢，攻擊免費 → 想活得漂亮就得一直打
   攻擊權（token）＝讓 1 對多 可讀：同時只有幾隻能進攻，其餘繞行伺機。 */
const poiseMaxOf = (u) => (u.poiseMax || 1);
const inSwingActive = (u) => !!(u.swing && u.swing.t >= u.swing.windup && u.swing.t < u.swing.windup + u.swing.active);
const hasHyperArmor = (u) => !!(u.swing && u.swing.mv.hyperArmor && inSwingActive(u));   // hyperArmor 是**招式**的性質，不是武器的
// 每幀推進體幹（受擊後有延遲才回）與怒火（只退不回）＋ hpLow/poiseLow 門檻重新武裝
function tickResources(u, dt) {
  const M = CONFIG.melee;
  if (u.poiseMax) {
    if (simTime - (u.poiseHitT || -99) >= M.poiseRegenDelay && u.staggerT <= 0)
      u.poise = Math.min(u.poiseMax, (u.poise || 0) + M.poiseRegen * dt);
    if (u._poiseLowFired && u.poise / u.poiseMax >= CONFIG.hooks.poiseLowFrac) u._poiseLowFired = false;
  }
  // 怒火：**只退不回**（DESIGN §2.2 ③），而且只在房裡還有活敵人時退——
  // 清場那一刻凍結，換房不另外扣（懲罰仔細撿東西的玩家是最糟的一種扣款）。
  if (u.wrathMax && wrathDecaying() && simTime - (u.wrathT || -99) >= CONFIG.wrath.decayDelay)
    u.wrath = Math.max(0, (u.wrath || 0) - CONFIG.wrath.decay * dt);
  tickCrystal(u, dt);
  if (u._hpLowFired && u.maxHp && u.hp / u.maxHp >= CONFIG.hooks.hpLowFrac) u._hpLowFired = false;
}
/* ── 怒火的四個入口（其餘地方一律走這四個，不要直接動 u.wrath）──────────
   wrathDecaying  現在該不該扣（房裡還有活敵人＝還在戰鬥）
   hasWrath       付得起嗎（wrathMax 為 0 的單位一律「付得起」＝所有閘門對 AI 短路）
   spendWrath     花掉
   gainWrath      回充（吃 wrathGainMul：重甲積得慢、誓約「不倦」積得快） */
const wrathDecaying = () => !roomCleared && enemies.some(e => !e.dead);
function hasWrath(u, n) { return !u.wrathMax || (u.wrath || 0) >= n; }
function spendWrath(u, n) { if (!u.wrathMax) return true; u.wrath = Math.max(0, (u.wrath || 0) - n); return true; }
function gainWrath(u, n) { if (!u || !u.wrathMax || !(n > 0)) return; u.wrath = Math.min(u.wrathMax, (u.wrath || 0) + n * (u.wrathGainMul || 1)); u.wrathT = simTime; }
// 想花但花不起：閃一下 + 掛勾（給之後的聖物/語音接線）
function failWrath(u) { u.noWrathFxT = 0.25; if (arenaMode && u.id === KNIGHT_ID && u.faction === 'player') arenaStats.noWrath++; Hooks.fire('wrathEmpty', { u }); }
/* 結晶＝騎士唯一的護身（CONFIG.crystal）。擊殺疊一層、隨時間掉，衰退規則和怒火一致：
   **清場凍結、跨房保留**。armorOf() 是「這個單位現在有多少甲」的唯一入口：
   敵人＝天生穿著，騎士＝結晶（人間的甲在地獄不值一提，所以他的 armorBase 恆為 0）。 */
const armorOf = (u) => clamp((u.armorBase || 0) + (u.armorTemp || 0), 0, 1);
function gainCrystal(u) {
  if (!u || u.id !== KNIGHT_ID || u.faction !== 'player') return;
  const C = CONFIG.crystal;
  u.armorTemp = Math.min(C.cap, (u.armorTemp || 0) + C.perKill);
  u.armorT = simTime;
  spawnFloater({ x: u.pos.x, y: u.pos.y - 18 }, '結晶', 'heal');
}
function tickCrystal(u, dt) {
  if (!u.armorTemp || u.id !== KNIGHT_ID) return;
  if (!wrathDecaying()) return;                                   // 清場＝凍結（跨房保留）
  if (simTime - (u.armorT || -99) < CONFIG.crystal.decayDelay) return;
  u.armorTemp = Math.max(0, u.armorTemp - CONFIG.crystal.decay * dt);
}
// 體幹傷害 → 可能觸發體幹破（大硬直 + 處決窗 + 大幅擊退）。回傳是否破了。by＝造成者（給 Hooks）。
function applyPoise(t, amount, fromAng, by) {
  if (!t.poiseMax || amount <= 0) return false;
  t.poiseHitT = simTime;
  t.poise = (t.poise || 0) - amount;
  if (t.poise > 0) {
    // poiseLow：跌破門檻觸發一次（回到門檻上由 tickResources 重新武裝）
    if (!t._poiseLowFired && t.poise / t.poiseMax < CONFIG.hooks.poiseLowFrac) { t._poiseLowFired = true; Hooks.fire('poiseLow', { u: t, frac: t.poise / t.poiseMax }); }

}
function breakPoise(t, fromAng, by) {
  const M = CONFIG.melee;

  t.staggerT = Math.max(t.staggerT || 0, M.poiseBreakStagger);
  t.swing = null; t.cast = null; t.blocking = false; t.blockT = null;   // 破了就是破了：揮到一半也中斷、施法也斷、盾也垮
  t.poiseBreakFxT = M.arcFadeT * 2;
  if (fromAng != null) applyKnock(t, fromAng + Math.PI, (t.lastKnock || 160) * M.poiseBreakKnockMul);
  Hooks.fire('poiseBroken', { u: t, by: by || null });

  spawnFloater(t.pos, '體幹破', 'poise');
  Sfx.play('block', t.pos);
}
/* 破防：舉著盾，但怒火付不出這一擊的價錢。
   騎士沒有體幹，所以這裡**不走 breakPoise**（那條是敵人的踉蹌 → 處決窗），
   而是自己給硬直。意思因此很乾淨：騎士被定住不是因為「挨太多下」，是因為**擋不起了**。 */
function guardBreak(u, fromAng, by) {
  const M = CONFIG.melee;
  u.guardBreakFxT = M.arcFadeT * 2;
  u.staggerT = Math.max(u.staggerT || 0, M.poiseBreakStagger);
  u.swing = null; u.cast = null; u.blocking = false; u.blockT = null;
  if (fromAng != null) applyKnock(u, fromAng + Math.PI, (u.lastKnock || 160) * M.poiseBreakKnockMul);
  Hooks.fire('guardBreak', { u, by: by || null });
  spawnCrit(u.pos);
  spawnFloater(u.pos, '破防', 'poise');
  Sfx.play('block', u.pos);
}

/* 跳下去之前，**把這一層地上剩下的東西全部捲進來**（使用者定案）。
   移掉「我是不是漏撿了什麼」這個焦慮，順便給落地一個視覺節拍。
   演出跑完才真的 endMission()。 */
function startVacuum() {
  if (!drops.length) { endMission(); return; }
  vacuumT = CONFIG.descent.vacuum;
  Sfx.play('pickup', knight() ? knight().pos : ENTRY);
}
function tickVacuum(dt) {
  if (vacuumT <= 0) return;
  const kn = knight();
  vacuumT -= dt;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (!kn) { drops.splice(i, 1); continue; }
    const dx = kn.pos.x - d.pos.x, dy = kn.pos.y - d.pos.y, L = Math.hypot(dx, dy) || 1;
    const step = Math.max(280, L * 6) * dt;
    if (L <= step) {   // 到手：進袋子（和走過去撿是同一份資料，強化不能掉）
      backpack.push({ kind: d.kind, id: d.id, ammo: d.ammo, quality: d.quality, enh: (d.enh || []).slice() });
      spawnPickup(d.pos); drops.splice(i, 1); continue;
    }
    d.pos.x += dx / L * step; d.pos.y += dy / L * step;
    if (Math.random() < 0.3) particles.push(mkPart(d.pos, 60, 0.3, '#ffd27a'));
  }
  if (vacuumT <= 0 || !drops.length) { vacuumT = 0; endMission(); }
}

/* ── 波次 ─────────────────────────────────────────────────────────────
   清光一波 → 別的門亮起來 → warn 秒後湧出下一波 → 最後一波清光才開洞。
   門的位置取「離騎士最遠的錨點」：不是為了公平，是為了**可讀**——
   你要有時間看到它、轉過去、決定要不要衝上去堵門口。 */
function waveGateFor() {
  const kn = knight();
  const cands = [];
  if (MAP.accessPoints && MAP.accessPoints.length) cands.push(...MAP.accessPoints);
  cands.push(...encounterAnchorsOf(MAP));
  if (!cands.length) return { x: WORLD.w / 2, y: WORLD.h / 2 };
  let best = cands[0], bd = -1;
  for (const c of cands) {
    const d = kn ? dist(kn.pos, c) : 0;
    if (d > bd) { bd = d; best = c; }
  }
  return { x: best.x, y: best.y };
}
function queueNextWave() {
  wavePending = { at: waveGateFor(), t: CONFIG.waves.warn };
  Sfx.play('alert', wavePending.at);
}
function tickWave(dt) {
  if (!wavePending) return;
  wavePending.t -= dt;
  if (wavePending.t > 0) return;
  const at = wavePending.at;
  wavePending = null;
  waveIdx++;
  // 波次內容沿用既有的遭遇模板（已經是設計過的兵種組合），tier 隨層數上升
  const tier = (MAP.tier || 1) + (floorNo - 1) * CONFIG.waves.tierPerFloor;
  const encId = pickEncounter(tier);
  const enc = ENCOUNTERS[encId];
  // 一律 'ambush' 開場＝直接 ENGAGED：門已經亮過了，湧出來的人沒有理由還在發呆
  for (const e of spawnGroup(enc.units, at, 'enemy', 'ambush', knight() ? knight().pos : ENTRY)) enemies.push(e);
  Hooks.fire('waveStart', { index: waveIdx, total: waveTotal, encId, at });
}
const waveActive = () => !!wavePending || waveIdx + 1 < waveTotal;   // 還有下一波沒來＝這房還沒完

/* ── 出口的洞 ─────────────────────────────────────────────────────── */
// 位置：房間中央。但中央可能落在牆裡，所以取**離中央最近的 waypoint**——
// waypoint 依定義是可站的點，這樣才保證跳得到（不會開在玩家走不進去的地方）。
function openExitPortal() {
  const c = { x: WORLD.w / 2, y: WORLD.h / 2 };
  let pos = c;
  if (MAP.waypoints && MAP.waypoints.length) {
    const n = nearestNode(c, false);
    if (n != null && wp(n)) pos = wp(n).pos;
  }
  exitPortal = { x: pos.x, y: pos.y, t: 0, open: false };
  hitstop(0.06);
  addShakeAt(pos, 7);            // 地板碎裂：一下悶震
  for (let i = 0; i < 26; i++) particles.push(mkPart(pos, 150, 0.7, '#c9a45c'));   // 碎石
  Sfx.play('grenade', pos);
}
function tickExitPortal(dt) {
  const p = exitPortal; if (!p || p.open) return;
  p.t += dt;
  if (p.t >= CONFIG.exit.openDur) { p.t = CONFIG.exit.openDur; p.open = true; }
}
const exitPortalReady = () => !!(exitPortal && exitPortal.open);

/* ── dash ─────────────────────────────────────────────────────────── */
// 方向：有移動輸入就用輸入方向（想往哪閃就往哪閃），沒有就用面向（往前突進）。
function startDash(u) {
  if (!u || u.state !== 'CONTROLLED') return false;
  const D = CONFIG.dash;
  if (u.dash || u.dashCd > 0 || u.staggerT > 0 || u.exec) return false;
  let fwd = 0, strafe = 0;
  if (Input.held('w')) fwd += 1; if (Input.held('s')) fwd -= 1;
  if (Input.held('d')) strafe += 1; if (Input.held('a')) strafe -= 1;
  let ang = u.facing;
  if (fwd || strafe) {
    const fx = Math.cos(u.facing), fy = Math.sin(u.facing);
    const rx = Math.cos(u.facing + Math.PI / 2), ry = Math.sin(u.facing + Math.PI / 2);
    ang = Math.atan2(fy * fwd + ry * strafe, fx * fwd + rx * strafe);
  }
  u.dash = { t: 0, dur: D.dur, ang };
  u.dashCd = D.cd;
  u.swing = null; u.cast = null; u.blocking = false; u.blockT = null;   // 閃避會取消當下的動作＝那是它的代價
  u.invulnT = Math.max(u.invulnT || 0, D.dur * D.iframeFrac);
  u.dashGhosts = [];
  Sfx.play('swap', u.pos);
  return true;
}
// 位移在這裡走，不經一般移動：dash 的速度與方向都不受輸入影響（按下去那一刻就決定了）。
// 位移用「逐幀推進」而非瞬移，所以之後的 collideWalls 仍然接得住＝不會穿牆。
function tickDash(u, dt) {
  const d = u.dash; if (!d) return;
  const D = CONFIG.dash;
  const step = (D.dist / Math.max(0.001, d.dur)) * dt;
  u.pos.x += Math.cos(d.ang) * step;
  u.pos.y += Math.sin(d.ang) * step;
  u.dashGhosts.push({ x: u.pos.x, y: u.pos.y, a: 1 });
  if (u.dashGhosts.length > D.trail) u.dashGhosts.shift();
  d.t += dt;
  if (d.t >= d.dur) u.dash = null;
}

/* ── 處決 ─────────────────────────────────────────────────────────── */
let execCount = 0;   // 本場處決次數（HUD/驗證用）
// 可處決的目標＝踉蹌中（體幹破）且在觸及距離內的敵人，取最近的。
function execTargetFor(u) {
  if (!u || u.state !== 'CONTROLLED' || u.exec || u.dash || u.staggerT > 0) return null;
  const R = CONFIG.melee.exec.range;
  let best = null, bd = R;
  for (const e of enemies) {
    if (e.dead || e.dummy || !(e.staggerT > 0)) continue;
    if (!hostile(u.faction, e.faction)) continue;
    const d = dist(u.pos, e.pos);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function startExecution(u, e) {
  const X = CONFIG.melee.exec;
  u.exec = { t: 0, dur: X.dur, target: e, ang: angTo(u.pos, e.pos) };
  u.swing = null; u.cast = null; u.blocking = false; u.blockT = null;
  u.invulnT = Math.max(u.invulnT || 0, X.dur + 0.08);   // 處決期間免傷＝敢衝進人堆裡吃這一口
  e.staggerT = Math.max(e.staggerT, X.dur + 0.05);      // 目標定住，不會在動畫中間走掉
  u.facing = u.exec.ang;
  hitstop(0.04);
  return true;
}
// 每幀推進；結束的那一幀結算（殺掉目標 + 回血 + 演出）
function tickExecution(u, dt) {
  const x = u.exec; if (!x) return;
  const X = CONFIG.melee.exec, e = x.target;
  u.facing = x.ang;                                  // 動作中朝向鎖住
  if (e && !e.dead) { e.staggerT = Math.max(e.staggerT, 0.05); }
  x.t += dt;
  if (x.t < x.dur) return;
  u.exec = null;
  if (!e || e.dead) return;                          // 目標中途被別的東西殺掉＝白做（不給血）
  const heal = Math.max(X.healMin, Math.round((e.maxHp || 40) * X.healFrac));
  const before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp + heal);
  const gained = Math.round(u.hp - before);
  e.hp = 0; killUnit(e, u);
  gainWrath(u, CONFIG.wrath.gainExec);   // 處決回怒（大）＝和回血同一個動作：處決是雙重補給
  execCount++;
  // 演出：頓幀 + 大震 + 血花 + 兩個字
  hitstop(X.hitstop);
  addShakeAt(e.pos, X.shake);
  spawnBlood(e.pos, x.ang); spawnBlood(e.pos, x.ang + 0.9); spawnBlood(e.pos, x.ang - 0.9);
  pushDecal(e.pos.x, e.pos.y, 10 + Math.random() * 5, 'rgba(122,20,28,0.62)');
  spawnFloater(e.pos, '處決', 'exec');
  if (gained > 0) spawnFloater({ x: u.pos.x, y: u.pos.y - 10 }, '+' + gained, 'heal');
  Sfx.play('crit', e.pos);
  Hooks.fire('execute', { u, victim: e, heal: gained });
}

/* 攻擊權：同時只有 CONFIG.melee.maxAttackers 隻近接敵可以進攻。
   取得後保有 tokenHold 秒（沒打到也會過期讓給別人＝不會卡死）。 */
/* 攻擊權的池是**以「被攻擊的目標」為單位**，不是全域一個。
   原本是全域單一 Map（上限 2）——那在「只有敵人會近戰」時看不出問題，但扈從一旦也有戰鬥 AI，
   扈從和敵人會搶同一組配額，變成「全場同時只有 2 個人在打」。每個目標各自有配額才對。 */
let attackTokens = new Map();   // 目標單位 → Map(攻擊者單位 → 到期 simTime)
function pruneAttackTokens() {
  for (const [tgt, m] of attackTokens) {
    for (const [atk, t] of m) if (t <= simTime || atk.dead || atk.hp <= 0) m.delete(atk);
    if (!m.size || tgt.dead || tgt.hp <= 0) attackTokens.delete(tgt);

}

function tryAcquireToken(e, tgt) {
  if (!tgt) return true;                       // 沒有明確目標＝不受配額限制
  let m = attackTokens.get(tgt);
  if (!m) { m = new Map(); attackTokens.set(tgt, m); }
  if (m.has(e)) { m.set(e, simTime + CONFIG.melee.tokenHold); return true; }
  if ((e.atkRestT || 0) > 0) return false;     // 剛揮完＝退開休息，讓別人上（進攻有節奏）
  if (m.size >= CONFIG.melee.maxAttackers) return false;
  m.set(e, simTime + CONFIG.melee.tokenHold);
  return true;
}
function releaseAttackToken(e) { e.tokenChain = 0; for (const [, m] of attackTokens) m.delete(e); }   // 交還攻擊權＝續攻連段計數歸零（脫戰/潰逃/死亡也一併重置）
const totalAttackTokens = () => { let n = 0; for (const [, m] of attackTokens) n += m.size; return n; };
/* AI 的近戰誤傷閘門：揮擊扇形內、且比目標更近的位置上有自己人 → 不揮。
   與遠程收火同一個原則（AI 不該蠢到自相殘殺）。**玩家的手動攻擊不受此限**＝自己的刀自己負責。 */
function friendlyInSwingArc(u, aimPos) {
  const FF = CONFIG.friendlyFire;
  if (!FF.enabled || !FF.aiHoldFire) return false;
  const M = lightOf(u.weapon); if (!M) return false;   // AI 只用 light（重擊是玩家的；要給菁英再說）
  const half = M.arcDeg * Math.PI / 360, reach = M.reach;
  const dT = aimPos ? dist(u.pos, aimPos) : Infinity;
  for (const o of [...activePlayers(), ...enemies]) {
    if (o === u || o.dead) continue;
    if (hostile(u.faction, o.faction)) continue;
    const d = dist(u.pos, o.pos);
    if (d > reach + o.radius || d > dT) continue;
    if (Math.abs(angDiff(angTo(u.pos, o.pos), u.facing)) <= half) return true;
  }
  return false;
}

/* 出一招。`move`＝招式定義（省略＝主手的 light）；`srcW`＝供應傷害/穿甲的那把武器

   招式的所有參數在這裡**複製進 swing**，之後 tickMelee / meleeHitTest 一律讀 swing，
   不再回頭讀武器——這樣同一把武器的兩招才能真的長得不一樣。 */
function startSwing(u, move, fireRateMult, hand, srcW) {

     於是 `1` 被當成招式傳進來——windup/active/recover 全變 NaN，

  if (!M || typeof M !== 'object' || !isFinite(M.windup + M.activeT + M.recover)) return false;
  if (u.swing || u.staggerT > 0 || u.parryT > 0 || u.cast || u.exec || u.dash) return false;   // 揮擊中/硬直中/招架中/施法前搖中/處決中/dash 中不能再揮
  // **揮擊不花任何資源**（DESIGN §2.2 ②）：你永遠打得動，因為往前打是唯一的活路。
  const rm = CONFIG.tempo / Math.max(0.05, (fireRateMult || 1) * (u.buffFire || 1));   // 攻速 buff＝縮短全段；× tempo＝整體前後搖更長

    hand: hand || 'main',

    off: 0, prevOff: 0,       // 刀刃相對 facing 的角度（本幀 / 上一幀）＝判定用的角度帶
    reachF: 1, prevReachF: 1, // 刀尖伸出比例（thrust 用）
  };
  u.blocking = false;   // 揮擊即放下盾
  if (arenaMode && u.id === KNIGHT_ID && u.faction === 'player') { arenaStats.swings++; arenaStats.lastHits = 0; arenaStats.lastDmg = 0; }
  Hooks.fire('attackStart', { u, W, move: M, melee: true });

}
// 判定窗內的進度 0→1（前搖期間為 0＝刀停在起始側，後搖期間為 1＝刀停在收尾側）
const swingProgress = (s, t) => clamp((t - s.windup) / Math.max(0.0001, s.active), 0, 1);
// 每幀推進揮斬狀態機。**刀刃會在判定窗內移動**（sweep＝掃過角度、thrust＝刀尖推出去），
// 判定只吃「刀刃這一幀掃過的那條角度帶」＝不是整個扇形同時生效。
function tickMelee(u, dt) {
  if (u.staggerT > 0) { u.staggerT -= dt; if (u.staggerT <= 0) { u.staggerT = 0; u.swing = null; } }
  tickWeaponParry(u, dt);
  const s = u.swing;
  if (!s) return false;
  const half = s.mv.arcDeg * Math.PI / 360;
  const thrust = s.mv.swingStyle === 'thrust';
  const prev = s.t; s.t += dt;
  const p0 = swingProgress(s, prev), p1 = swingProgress(s, s.t);
  if (thrust) {   // 突刺：角度不動，刀尖由 thrustMinReachF 推到滿
    const f = CONFIG.melee.thrustMinReachF;
    s.prevOff = 0; s.off = 0;
    s.prevReachF = f + (1 - f) * p0; s.reachF = f + (1 - f) * p1;
  } else {        // 橫掃：刀刃由一側掃到另一側（dir 決定左→右或右→左）
    s.prevOff = s.dir * (-half + 2 * half * p0);
    s.off     = s.dir * (-half + 2 * half * p1);

  if (s.t >= aEnd + s.recover) {

    if (u.faction !== 'player') {
      const keepBase = CONFIG.melee.tokenKeepBase;
      const keepP = keepBase - (u.tokenChain || 0) * CONFIG.melee.tokenKeepDecay;
      if (Math.random() < keepP) u.tokenChain = (u.tokenChain || 0) + 1;         // 續攻：留權、不休息 → 直接接下一刀
      else { u.atkRestT = CONFIG.melee.tokenRest; releaseAttackToken(u); }        // 收手：releaseAttackToken 內會歸零 tokenChain

// 輸出傷害倍率＝meta 升級「鋒銳」(dmgMul) × 誓約「無畏」(低血背水)；近接與遠程同一把尺。
const outDmgMul = (u) => (u.dmgMul || 1) * ((u.berserk && u.hp < u.maxHp * u.berserk.frac) ? u.berserk.mul : 1);   // u.berserk＝誓約「無畏」（低血輸出↑），與已移除的士氣「捨身」無關
// 刀刃掃過的角度帶判定：只有「上一幀→本幀」之間掃過的角度算命中（再各放寬 bladeHalfDeg＝刀刃厚度）。

function meleeHitTest(u, s) {
  const M = s.mv, W = s.W;   // 招式（形狀/體幹/擊退）＋ 出招的那把武器（傷害/穿甲）
  const bladeHalf = CONFIG.melee.bladeHalfDeg * Math.PI / 180;
  const lo = Math.min(s.prevOff, s.off) - bladeHalf;   // 本幀刀刃掃過的角度帶（相對 facing）
  const hi = Math.max(s.prevOff, s.off) + bladeHalf;

  const cleave = M.cleave || 1;
  const targets = [...activePlayers(), ...enemies.filter(e => !e.dead)].filter(t => canHarm(u, t));   // 友軍誤傷：揮到誰就是誰（斧的 cleave 會砍到自己的扈從）
  for (const t of targets) {
    if (s.n >= cleave) break;
    if (s.hits.has(t)) continue;
    const d = dist(u.pos, t.pos);
    if (d > reach + t.radius) continue;
    // 目標有體積：把半徑換算成角度寬容，否則貼身的大個子會從刀刃縫隙溜掉
    const slack = Math.asin(clamp(t.radius / Math.max(t.radius, d), 0, 1));
    const rel = angDiff(angTo(u.pos, t.pos), u.facing);
    if (rel + slack < lo || rel - slack > hi) continue;
    if (!clearLine(u.pos, t.pos)) continue;               // 牆/門後打不到
    s.hits.add(t); s.n++;

    const back = Math.abs(angDiff(fromAng, t.facing)) > Math.PI / 2;   // 從目標背面砍＝短劍背刺加成
    let dmg = W.damage * (M.dmgMul || 1) * (back ? (M.backstabMul || 1) : 1) * outDmgMul(u);   // 招式倍率 × 背刺 × meta「鋒銳」/誓約「無畏」
    if (u.faction !== 'player' && t.faction === 'player') dmg *= CONFIG.enemy.meleeDmgMul;   // 英雄 vs 群體：AI 近接對我方減傷
    if (isFriendlyHit(u.faction, t)) dmg *= CONFIG.friendlyFire.dmgMul;                      // 誤傷倍率
    const hp0 = t.hp, stag0 = t.staggerT || 0, swing0 = !!t.swing;
    const blocked = damageUnit(t, dmg, clamp((W.pierce || 0) + (u.pierceBonus || 0), 0, 1), fromAng, { melee: true, attacker: u, knock: (M.knock || 0) * (u.knockMul || 1), stagger: M.stagger || 0, poiseDmg: M.poiseDmg || 0 });   // 誓約「長驅」：pierceBonus 破甲 + knockMul 逼退
    Hooks.fire('attackHit', { u, t, dealt: Math.max(0, hp0 - t.hp), melee: true, blocked, backstab: back, armorDeflect: (hp0 === t.hp && !blocked) });
    if (arenaMode) {   // 試作場即時數據：本次揮擊打中幾隻、實際扣多少血（含裝甲/格擋後的真值）
      const dealt = Math.max(0, hp0 - t.hp);
      const broke = (t.staggerT || 0) > stag0;
      const cut = swing0 && !t.swing && !broke;   // 揮擊被打斷（不是體幹破造成的）
      if (u.faction === 'player' && u.id === KNIGHT_ID) {
        arenaStats.hits++; arenaStats.lastHits++; arenaStats.dmg += dealt; arenaStats.lastDmg += dealt;
        if (blocked) arenaStats.blocked++;
        if (broke) arenaStats.brokeFoe++;
        if (cut) arenaStats.interrupted++;
      } else if (t.faction === 'player' && t.id === KNIGHT_ID) {
        arenaStats.tookHits++;
        if (blocked) { if (dealt <= 0) arenaStats.tookParried++; else arenaStats.tookBlocked++; }
        if (broke) arenaStats.tookBreak++;
      }
    }
    spawnSwingFx(u, t, blocked);
    hitstop(blocked ? CONFIG.melee.hitstopBlocked : CONFIG.melee.hitstopHit);
    addShakeAt(u.pos, CONFIG.melee.shakeHit);
  }
}
// 擊退：給目標一個會衰減的速度（不瞬移＝仍走既有的牆面碰撞，不會穿牆）
function applyKnock(t, ang, power) { if (!power) return; t.kbx = (t.kbx || 0) + Math.cos(ang) * power; t.kby = (t.kby || 0) + Math.sin(ang) * power; }
function tickKnock(u, dt) {
  if (!u.kbx && !u.kby) return;
  u.pos.x += u.kbx * dt; u.pos.y += u.kby * dt;
  const k = Math.exp(-CONFIG.melee.knockDecay * dt);
  u.kbx *= k; u.kby *= k;
  if (Math.abs(u.kbx) < 2 && Math.abs(u.kby) < 2) { u.kbx = 0; u.kby = 0; }
}
// 盾格是否成立：正在舉盾 + 來向落在正面護弧內（背後打不擋）。護弧寬窄由副手的盾決定。
const blockActive = (u) => !!u.blocking && u.blockT != null;
function blockCovers(u, fromAng) {
  if (!blockActive(u)) return false;
  return Math.abs(angDiff(fromAng, u.facing)) <= blockArcOf(u) * Math.PI / 360;
}
/* ── 武器招架（無盾時的唯一防禦，使用者定案）───────────────────────────
   點按右鍵＝一次招架動作：前 wpWindow 秒是判定窗，接到攻擊＝完全格擋+重創對方；
   **窗過了還沒接到任何攻擊 → 自己硬直**（空揮的代價）。收招期間挨打＝正常吃傷。 */
function startWeaponParry(u) {
  if (!u.weapon || !u.weapon.melee) return false;          // 遠程武器不能招架
  if (u.parryT > 0 || u.swing || u.staggerT > 0) return false;
  // 招架不收費（DESIGN §2.2：招架是三段回充的中段）。它的代價是**落空就自己硬直**，
  // 那比扣資源更好——賭錯的懲罰立刻兌現在身體上，而不是記在帳上。
  u.parryT = 1e-6; u.parryDur = CONFIG.melee.wpRecover; u.parryHit = false;
  Sfx.play('block', u.pos);
  return true;
}
const wpWindowOpen = (u) => u.parryT > 0 && u.parryT <= CONFIG.melee.wpWindow;
function tickWeaponParry(u, dt) {
  if (!(u.parryT > 0)) return;
  const wasOpen = wpWindowOpen(u);
  u.parryT += dt;
  // 判定窗剛關上、而且整個動作都沒接到攻擊 → 空招架＝自己硬直
  if (wasOpen && !wpWindowOpen(u) && !u.parryHit) {

}
// 揮擊中的移動/轉向倍率（前搖還能修正方向，揮出去就幾乎鎖死＝要預判）
function swingMoveMul(u) {
  const s = u.swing;
  if (u.cast) return CONFIG.melee.castMoveMul;   // 施法前搖：走得比揮擊前搖還慢（定身唸咒的代價）
  if (!s) return u.blocking ? CONFIG.melee.blockMoveMul : (u.parryT > 0 ? CONFIG.melee.wpMoveMul : 1);
  if (s.t < s.windup) return CONFIG.melee.windupMoveMul;

}

// 只有「揮出去之後」（判定窗 + 後搖）會限速——前搖仍然 1:1，你要瞄準的時候瞄得動。
function swingTurnRate(u) {
  const s = u.swing;
  return (s && s.t >= s.windup) ? CONFIG.melee.swingTurnRate : null;
}

// spreadDeg：本發實際發散；bloomAdd>0 才累積連射發散。回傳是否真的開了一槍。
function fireUnit(u, angle, spreadDeg, fireRateMult, bloomAdd) {
  const W = u.weapon;
  if (W.melee) return startSwing(u, lightOf(W), fireRateMult, 'main', W);   // 近接＝主手輕擊（左鍵）；右鍵那招在輸入層另外派工
  if (u.reloadT > 0 || u.fireCooldown > 0) return false;
  if (u.ammoInMag <= 0) { startReload(u); return false; }
  const pellets = W.pellets || 1;   // 霰彈：單次擊發多顆彈丸，各自抽散布
  const spreadF = (u.spreadMul || 1);

  const isPlayer = u.faction === 'player';

  const isTracer = !!W.tracer;   // B 狙擊型：**每一發**都要留下亮痕——彈速近乎 hitscan，沒有痕跡玩家就不知道自己被什麼打到了
  for (let p = 0; p < pellets; p++) {
    const a = angle + (Math.random() * 2 - 1) * spreadDeg * spreadF * Math.PI / 180;
    bullets.push({
      x: u.pos.x + Math.cos(angle) * (u.radius + 2), y: u.pos.y + Math.sin(angle) * (u.radius + 2),
      vx: Math.cos(a) * W.projSpeed * CONFIG.juice.bulletSpeedMul, vy: Math.sin(a) * W.projSpeed * CONFIG.juice.bulletSpeedMul,   // 碰撞是掃描式（不穿透），所以放慢彈速不會漏判
      dmg: W.damage * dmgF * outDmgMul(u), faction: u.faction, range: W.range, traveled: 0,   // meta 升級「鋒銳」+ 誓約「無畏」
      poiseDmg: W.poiseDmg || 0, knock: W.knock || 0,   // **遠程也要打體幹**：沒有這個，弓弩投槍永遠開不出處決窗（§2.4 的迴圈對它們是斷的）

       格擋救了你這一下，但花掉的怒火讓你之後更脆——它不是免費的保險，是一筆得趕快打回來的借款。 */

    poiseDmg *= M.blockPoiseMul;

      const W = CONFIG.wrath;
      const cost = (W.costBlockBase + poiseDmg * W.costBlockPerPoise) * blockWrathMulOf(u) * (u.blockWrathMul || 1);   // 誓約「不退」：擋得便宜

    // 被擊中→記下來向當作「最後已知位置」：背後挨刀的敵人會回頭，而不是傻站著。
    // （C5 之前這裡會把來向廣播給附近同袍，那套全體共享的情報網隨戰術 AI 一起移除了。）

  const AR = CONFIG.armor;
  const armorNow = (blocked || flanked) ? 0 : armorOf(u);

    if ((u.aimT || 0) > 0) { u.aimT = 0; it = true; }                            // 遠程瞄準預告
    if (it) { u.flinchFxT = 0.18; Hooks.fire('interrupt', { u, by }); }

  spawnFloater(u.pos, String(Math.round(raw)), (flanked || surprise) ? 'crit' : 'hit');   // 傷害數字（raw＝實際打出去的，不是被 overkill 夾過的 dealt）
  addShakeAt(u.pos, (flanked || surprise) ? CONFIG.juice.shakeHit * 1.6 : CONFIG.juice.shakeHit);   // 命中震動（依離相機衰減）
  u.hitFlash = CONFIG.juice.hitFlash;                                 // 受擊閃白（單位本體，0.12s）
  u.cardHitT = CONFIG.juice.cardHit;                                  // 狀態卡的紅框＋震動（比本體長，不然掃一眼會漏看）
  const pa = (fromAng != null) ? fromAng + Math.PI : u.facing;        // 子彈推進方向（背向射手）
  u.flinchX = Math.cos(pa) * CONFIG.juice.flinch; u.flinchY = Math.sin(pa) * CONFIG.juice.flinch;   // 後仰（繪製偏移）
  spawnBlood(u.pos, pa); pushDecal(u.pos.x, u.pos.y, 3 + Math.random() * 3, 'rgba(122,20,28,0.5)');  // 血霧 + 地上血漬
  // 交戰聲：命中會被聽見（驚動附近 IDLE 敵）——但「潛行一擊斃命(對未察覺者)」＝無聲擊殺(hp<=0 那條由 killUnit 依 combatDeath 判定)。

}

    if (u.caches > 0) { for (let i = 0; i < u.caches; i++) cacheGround.push({ x: u.pos.x + (Math.random() * 16 - 8), y: u.pos.y + (Math.random() * 16 - 8) }); u.caches = 0; Sfx.play('death', u.pos); }   // 運搬者陣亡→密封容器掉在原地，待人回收（比照機密檔案）

    hitstop(CONFIG.juice.deathHitstop);   // 陣亡：只頓一下（不帶鏡頭去死亡點，激戰中不干擾操作）

    if (u.id === KNIGHT_ID) controlledId = null;

}
// 掉落：陣亡單位的武器落在原地（底線武器不掉、無回收價值）。彈藥折算量於休息關進儲備。

// 開發測試：第0關地上陳列各式武器(上排)與道具(下排)＝一般掉落（走過撿進背包，到休息關再配裝/使用）

  ITEM_IDS.forEach((id, i) => drops.push({ pos: { x: 170 + i * 150, y: 600 }, kind: 'item', id, dev: true }));   // dev＝只用於在地上標出名稱，撿取行為與一般掉落相同

// 拾取：僅騎士走到掉落物上即撿入臨時背包（任務中不可動用＝撿/不撿的時間/暴露取捨；到休息關處理）

  for (let i = drops.length - 1; i >= 0; i--) {

      // 撿起來的武器精良度與詞條會歸零（下游 enhSummary/effWeapon 都在讀它們）。

// 機密檔案：掉在地上時，任一活動我方（含自走撤離者經過）走到 pickupRadius 內即接手背上（全場唯一）
function updateFile() {
  if (!fileDrop) return;

// 密封容器：地上的容器，任一活動我方走到 pickupRadius 內即背上（u.caches++，比照機密檔案；撤離才開封）

function slotsOf() { return 1; }   // 「重武器佔兩格」隨 weight 欄位一起移除（§2.6b）

function isBasic(kind, id) {

const MYSTERY_CAT_WEIGHT = { weapon: 3, equip: 2, item: 2, ability: 1.5 };

function rollMysteryLoot() {
  const pools = {

    equip: EQUIP_IDS.filter(id => !isBasic('equip', id)),

    ability: ABILITY_IDS.filter(id => !isBasic('ability', id)),

/* =====================================================================
   互動 — 開關門 / 按鈕（僅騎士；自走單位不會開門，§Q4）
   ===================================================================== */
const doorMid = (d) => ({ x: (d.x1 + d.x2) / 2, y: (d.y1 + d.y2) / 2 });

const distToDoor = (pos, d) => dist(pos, closestOnSeg(pos, { x: d.x1, y: d.y1 }, { x: d.x2, y: d.y2 }));

function nearestInteractable(u) {
  if (!u) return null;
  let best = null, bd = CONFIG.interactRadius;
  for (const d of MAP.doors) { const dd = distToDoor(u.pos, d); if (dd < bd) { bd = dd; best = { type: 'door', door: d }; } }
  for (const b of MAP.buttons) { const dd = dist(u.pos, { x: b.x, y: b.y }); if (dd < bd) { bd = dd; best = { type: 'button', button: b }; } }
  for (const pr of (prisoners || [])) { if (pr.freed) continue; const dd = dist(u.pos, pr.pos); if (dd < bd) { bd = dd; best = { type: 'prisoner', prisoner: pr }; } }

}
function tryInteract() {

  const u = players[controlledId]; if (!u || u.state !== 'CONTROLLED') return;

  else if (it.type === 'button') { const d = MAP.doors.find(x => x.id === it.button.doorId); if (d) d.open = !d.open; Sfx.play('door'); }
  else if (it.type === 'prisoner') freePrisoner(it.prisoner);

function updateBullets(dt) {

    b.traveled += Math.hypot(b.vx, b.vy) * dt;

    const TW = HALFWALL();   // 子彈撞渲染牆面（離中心線 ≤ 半厚）
    if (!gone) for (const w of MAP.walls) if (segSegDist(old, b, { x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }) <= TW) { gone = true; break; }           // 永久牆全擋
    if (!gone) for (const dr of MAP.doors) if (!dr.open && segSegDist(old, b, { x: dr.x1, y: dr.y1 }, { x: dr.x2, y: dr.y2 }) <= TW) { gone = true; break; } // 關門全擋

    if (!gone) for (const lw of MAP.lowWalls) {
      if (!segIntersect(old, b, { x: lw.x1, y: lw.y1 }, { x: lw.x2, y: lw.y2 })) continue;
      const cp = closestOnSeg({ x: b.ox, y: b.oy }, { x: lw.x1, y: lw.y1 }, { x: lw.x2, y: lw.y2 });
      if (dist({ x: b.ox, y: b.oy }, cp) >= CONFIG.lowWall.closeRange && Math.random() < CONFIG.lowWall.blockChance) { gone = true; break; }
    }
    // 可破壞地形：依形態判擋；命中扣 HP（玻璃穿/擋都扣、矮牆被擋才扣、wall 必擋必扣），歸零換 broken 形態
    if (!gone) for (const d of destructibles()) {
      const prof = dProfile(d); if (prof.bullet === 'pass') continue;
      if (!segIntersect(old, b, { x: d.x1, y: d.y1 }, { x: d.x2, y: d.y2 })) continue;
      let blocked = false, hit = false;
      if (prof.bullet === 'block') { blocked = true; hit = true; }
      else if (prof.bullet === 'glass') { hit = true; blocked = Math.random() < (1 - (b.pierce || 0)); }   // 非穿甲擋第一槍、穿甲穿過

      if (hit) { d.curHp -= b.dmg; if (d.curHp <= 0) d.cur = d.broken; spawnHit({ x: b.x, y: b.y }); }
      if (blocked) { gone = true; break; }
    }

        if (b.flash) { t.flash = Math.min(CONFIG.flash.max, (t.flash || 0) + b.flash); gone = true; break; }   // 閃光彈丸：累積暈眩、不造成傷害（中越多顆越暈）
        let dmg = b.dmg;

  const turn = (e.turn || CONFIG.enemy.turnSpeed) * Math.PI / 180 * dt;
  if (seen) {

    e.facing = rotToward(e.facing, ang, turn * 2 * aimTMul);

    if (inRange && token) { e.engageTimer += dt; if (e.engageTimer >= CONFIG.enemy.reactionDelay) enemyAttack(e, e.weapon.melee ? ang : e.facing, dt); }   // 親眼看到才射；近接還需攻擊權
    else { e.engageTimer = 0; e.aimT = 0; }   // 沒得射＝瞄準歸零（預告不能留在畫面上）
  } else {
    e.engageTimer = 0; e.aimT = 0;
    e.facing = rotToward(e.facing, angTo(e.pos, knownPos), turn);   // 跟丟：朝最後看到的位置

/* Shift 奔跑倍率：**固定值**（使用者定案）。
   舊版是「負重（甲＋兩組主手＋副手全部加總）越重跑越慢」，整條拿掉了，理由有三：
     ① 奔跑已經明碼吃怒火了——那是看得見、你自己按下去的成本。再疊一層由配裝決定的隱形稅
        就是同一件事收三次錢（重甲已經付了 moveMul 和 wrathGainMul）。
     ② 它沒有任何 UI。裸裝 1.9× 對滿裝 1.1× 是接近兩倍的差距，卻沒有一個字告訴玩家。
     ③ 「多帶一把備用武器就跑得慢」是背包管理遊戲的邏輯，不是 DOOM。 */
const sprintMult = () => CONFIG.sprint.mult;

function moveToward(u, goal, step) {
  const d = dist(u.pos, goal); if (d < 1e-3) return;
  if (u.faction === 'player') step *= bushSpeedMult(u) * rangedActionMoveMul(u);   // 草叢減速 + 遠程裝填/瞄準減速（我方 AI 扈從；騎士在 WASD 位移分支自行套用）
  const moved = Math.min(step, d), k = moved / d;

}
function pushOutSeg(u, x1, y1, x2, y2) {
  const cp = closestOnSeg(u.pos, { x: x1, y: y1 }, { x: x2, y: y2 });
  const dx = u.pos.x - cp.x, dy = u.pos.y - cp.y, d = Math.hypot(dx, dy);
  if (d < u.radius) { const push = u.radius - d, nx = d > 1e-6 ? dx / d : 1, ny = d > 1e-6 ? dy / d : 0; u.pos.x += nx * push; u.pos.y += ny * push; }
}

    const mv = dProfile(d).move;

  for (const d of destructibles()) { if (dProfile(d).move !== 'slow') continue; const cp = closestOnSeg(pos, { x: d.x1, y: d.y1 }, { x: d.x2, y: d.y2 }); if (dist(pos, cp) < r) return true; }
  for (const z of areas()) { if (aMat(z).move !== 'slow') continue; const cx = clamp(pos.x, z.x, z.x + z.w), cy = clamp(pos.y, z.y, z.y + z.h); if (dist(pos, { x: cx, y: cy }) < r) return true; }

  // 5) 子彈 / 特效
  updateBullets(dt); updateGrenades(dt); updateFlashFx(dt); updateParticles(dt); updateFloaters(dt);

  // 6) 擊退位移 + 分離 + 牆面碰撞 + 掉落物拾取（擊退走位移而非瞬移＝仍吃 collideWalls，不會被推穿牆）
  const movers = [...activePlayers(), ...enemies.filter(e => !e.dead)];
  for (const u of movers) tickKnock(u, dt);
  separate(movers);
  for (const u of movers) collideWalls(u);
  updateDrops(); updateFile(); updateCaches();

  // 7) 撤離判定：走到撤離點的人脫離戰場（試作場不判定撤離＝打不完，專心調手感）
  if (arenaMode) {
    // 假人：被擊退後慢慢飄回原位（維持整齊的一列，方便反覆測 cleave / 擊退距離）
    for (const e of enemies) {
      if (!e.dummy || e.dead || !e.homePos) continue;
      if (Math.abs(e.kbx) > 2 || Math.abs(e.kby) > 2) continue;
      const d = dist(e.pos, e.homePos);
      if (d > 2) moveToward(e, e.homePos, Math.min(d, 45 * dt));
    }
    simTime += dt;
    if (!knightAlive()) arenaResetFight();   // 試作場：騎士倒下＝原地重來，不結束
    return;
  }

  // 7.5) 清場 → **開洞**（不是直接結算）。
  // 清場那一刻房間中央的地板碎裂、洞打開；玩家自己走過去跳下去才進下一層。
  // 中間那段時間是留給你的：撿東西、看戰場、喘一口氣。
  // ⚠️ `!wavePending` 是必要的：門亮著的那 warn 秒場上仍然「全部都死了」，
  //    少了它就會每一幀重新排一次下一波，計時器永遠回到滿格＝那一波永遠不會來。
  if (!roomCleared && !wavePending && enemies.length && enemies.every(e => e.dead)) {
    if (waveIdx + 1 < waveTotal && !introActive) {
      queueNextWave();          // 還有下一波：別的門亮起來，先不開洞
    } else {
      roomCleared = true;
      // 序章是腳本化的演出（他是離開戰場，不是墜入地獄），不開洞、照舊直接收尾。
      if (!introActive) openExitPortal();
    }
  }
  tickWave(dt);
  tickVacuum(dt);
  if (roomBannerT > 0) roomBannerT -= dt;
  tickExitPortal(dt);

  // 8) 計時 + 結算。**跳進洞**＝過關；騎士陣亡＝run 結束。
  simTime += dt;
  const kn = knight();
  if (!kn || !knightAlive()) endMission();
  else if (roomCleared && !exitPortal) endMission();                                  // 序章等不開洞的情境：沿用清場即結束
  else if (exitPortalReady() && kn.state === 'CONTROLLED') {
    // 站上洞口＝**先問一次**，不直接掉下去。清完場的走動很隨意（撿東西、繞一圈），
    // 一腳踩進去就結束這一房會是最無謂的一種挫折。
    const on = dist(kn.pos, exitPortal) <= CONFIG.exit.radius;
    if (on && !exitPortal.declined) { exitPrompt = true; }
    if (!on) exitPortal.declined = false;   // 走開再回來＝可以再問一次（不然拒絕過就永遠問不到了）
  }
}

function applyCam() { ctx.translate(cv.width / 2 + shakeX, cv.height * camAnchorY + shakeY); ctx.rotate(cam.angle); ctx.scale(cam.scale, cam.scale); ctx.translate(-cam.x, -cam.y); }

function draw() {
  shakeX = 0; shakeY = 0;
  ctx.clearRect(0, 0, cv.width, cv.height);

  if (scene === 'ARENASEL') { drawArenaSelect(); return; }

  if (!Input.locked) { drawCombatStart(); return; }

  // 打擊感：本幀螢幕震動偏移（隨機抖 + 相機踢；套用於 applyCam/w2s 錨點）
  shakeX = (Math.random() * 2 - 1) * shakeAmt; shakeY = (Math.random() * 2 - 1) * shakeAmt + kickY;

  // ---- 世界（鏡頭變換）----
  ctx.save(); applyCam();

  drawDecals(); drawExitPortal(); drawWaveGate(); drawCorpses(); drawDrops(); drawPrisoners(); drawIntroActors(); drawParticles(); drawBullets(); drawGrenades();
  drawMeleeFx([...enemies.filter(e => !e.dead && isRevealed(e)), ...players]);   // 近接弧畫在單位之下（不遮血條/身體）；敵人比照 drawEnemies 只畫已感知者
  drawEnemies(); drawPlayers(); drawFlashFx();

  ctx.save(); applyCam(); drawSkeleton(); drawFileDrop(); drawCacheDrops(); ctx.restore();

// 簡易自動換行（依 measureText；headless stub 回固定寬→不換行，無例外）
function wrapText(text, maxW) {
  const out = []; let cur = '';
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }
    const t = cur + ch;
    if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = ch; } else cur = t;
  }
  if (cur || !out.length) out.push(cur);
  return out;
}
// 對話泡：圓角框 + 指向頭頂的小尾，置於螢幕座標 s 的上方；夾在畫面內
function drawSpeechBubble(s, text) {
  ctx.font = '15px Consolas';
  const lines = wrapText(text, 230), lh = 20, pad = 9;
  let tw = 0; for (const l of lines) tw = Math.max(tw, ctx.measureText(l).width);
  const w = tw + pad * 2, h = lines.length * lh + pad * 2 - 4;
  let bx = clamp(s.x - w / 2, 8, cv.width - w - 8);
  let by = s.y - 22 - h; if (by < 8) by = s.y + 22;   // 頭頂放不下就改放下方
  const r = 8;
  ctx.fillStyle = 'rgba(12,16,22,0.92)'; ctx.strokeStyle = 'rgba(127,227,255,0.65)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by); ctx.arcTo(bx + w, by, bx + w, by + h, r); ctx.arcTo(bx + w, by + h, bx, by + h, r);
  ctx.arcTo(bx, by + h, bx, by, r); ctx.arcTo(bx, by, bx + w, by, r); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 指向頭頂的小三角尾
  const tailX = clamp(s.x, bx + 14, bx + w - 14), tipY = (by > s.y) ? by : by + h, dir = (by > s.y) ? -1 : 1;
  ctx.beginPath(); ctx.moveTo(tailX - 7, tipY); ctx.lineTo(tailX + 7, tipY); ctx.lineTo(tailX, tipY + dir * 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e6edf3'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + pad + 14 + i * lh));
  ctx.textAlign = 'left';
}

// 區域地形：solid/cover 實心、barrier/lowcover 半透+斜線(可看穿/越射)、smoke 柔灰半透
function drawAreas() {
  for (const z of areas()) {
    const m = aMat(z), col = m.col || '120,120,120';
    if (z.mat === 'smoke') {
      ctx.fillStyle = `rgba(${col},0.5)`; ctx.fillRect(z.x, z.y, z.w, z.h);
    } else if (m.los === false) {   // barrier / lowcover：可看穿 → 半透 + 斜線示意
      ctx.fillStyle = `rgba(${col},0.20)`; ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.save(); ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip();
      ctx.strokeStyle = `rgba(${col},0.55)`; ctx.lineWidth = 1.5;
      for (let x = z.x - z.h; x < z.x + z.w; x += 12) { ctx.beginPath(); ctx.moveTo(x, z.y + z.h); ctx.lineTo(x + z.h, z.y); ctx.stroke(); }
      ctx.restore();
      ctx.setLineDash([8, 5]); ctx.strokeStyle = `rgba(${col},0.85)`; ctx.lineWidth = 2; ctx.strokeRect(z.x, z.y, z.w, z.h); ctx.setLineDash([]);
    } else {   // solid / cover：實心方塊
      ctx.fillStyle = `rgba(${col},${z.mat === 'cover' ? 0.82 : 0.95})`; ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = `rgba(${col},1)`; ctx.lineWidth = 2; ctx.strokeRect(z.x, z.y, z.w, z.h);
    }
  }
}

// 可破壞地形：依現形態繪（wall 棕實線/glass 淡藍透明/lowwall 棕虛線/fence 交叉網/flat 不畫）+ 受損變淡
function drawDestructibles() {
  for (const d of destructibles()) {
    if (d.cur === 'flat') continue;
    const frac = Math.max(0, Math.min(1, (d.curHp || 0) / (d.hp || 1)));
    const dim = 0.45 + 0.55 * frac;   // 受損→變淡（裂痕感）
    ctx.lineCap = 'round';
    if (d.cur === 'wall') { ctx.strokeStyle = `rgba(150,120,80,${dim})`; ctx.lineWidth = 6; seg(d); }
    else if (d.cur === 'glass') { ctx.strokeStyle = `rgba(150,210,235,${0.3 + 0.4 * frac})`; ctx.lineWidth = 5; seg(d); }
    else if (d.cur === 'lowwall') { ctx.setLineDash([10, 6]); ctx.strokeStyle = `rgba(165,140,100,${dim})`; ctx.lineWidth = 5; ctx.lineCap = 'butt'; seg(d); ctx.setLineDash([]); ctx.lineCap = 'round'; }
    else if (d.cur === 'fence') {   // 鐵絲網：細線 + 沿線交叉小斜
      ctx.strokeStyle = 'rgba(160,170,180,0.6)'; ctx.lineWidth = 2; seg(d);
      const L = Math.hypot(d.x2 - d.x1, d.y2 - d.y1) || 1, ux = (d.x2 - d.x1) / L, uy = (d.y2 - d.y1) / L, nx = -uy, ny = ux;
      for (let t = 6; t < L; t += 12) { const cx = d.x1 + ux * t, cy = d.y1 + uy * t; ctx.beginPath(); ctx.moveTo(cx - nx * 4, cy - ny * 4); ctx.lineTo(cx + nx * 4, cy + ny * 4); ctx.stroke(); }
    }
  }
}

// 出口的洞：碎裂的地板 → 黑洞 → 往上打的光柱。開啟中是縮放進場，開好之後緩慢脈動。
function drawExitPortal() {
  const p = exitPortal; if (!p) return;
  const X = CONFIG.exit;
  const k = clamp(p.t / X.openDur, 0, 1);
  const ease = 1 - Math.pow(1 - k, 3);                   // 開得快、收得緩
  const R = X.drawR * ease * (p.open ? 1 + 0.04 * Math.sin(simTime * 3) : 1);
  // 碎裂的邊：外圈鋸齒石環
  ctx.save();
  ctx.strokeStyle = `rgba(190,150,90,${0.7 * ease})`; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 18; i++) {
    const a = (i / 18) * Math.PI * 2, rr = R * (1.08 + 0.10 * Math.sin(i * 2.7));
    const x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  // 洞本體：往內漸深
  const g = ctx.createRadialGradient(p.x, p.y, R * 0.15, p.x, p.y, R);
  g.addColorStop(0, 'rgba(0,0,0,0.96)'); g.addColorStop(0.7, 'rgba(10,6,14,0.9)'); g.addColorStop(1, 'rgba(40,20,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
  // 往上打的光：地獄在下面，但光是從洞裡透出來的
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 2.2);
  lg.addColorStop(0, `rgba(255,150,80,${0.30 * ease})`); lg.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(p.x, p.y, R * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawZonesWorld() {   // 進場點（撤離圈隨 C6 移除）

function drawBullets() {
  ctx.save(); ctx.lineCap = 'round';
  const alpha = CONFIG.juice.bulletAlpha;
  // 一般彈：極細淡線、僅提示彈道（不畫亮頭/blob）；alpha=0 則完全隱形
  if (alpha > 0) {
    ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 1;
    for (const b of bullets) {
      if (b.tracer || b.orb || b.magic) continue;
      const l = Math.hypot(b.vx, b.vy) || 1, len = clamp(l * 0.03, 8, 54);
      const col = b.faction === 'player' ? '185,212,236' : '226,176,150';
      ctx.strokeStyle = `rgba(${col},${alpha})`;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * len, b.y - b.vy / l * len); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  // 曳光彈：火光色（橙黃）、較長較亮的加色拖尾
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 2.4;
  for (const b of bullets) {
    if (!b.tracer || b.magic) continue;
    const l = Math.hypot(b.vx, b.vy) || 1, len = clamp(l * 0.05 * CONFIG.juice.tracer, 22, 180);
    const tx = b.x - b.vx / l * len, ty = b.y - b.vy / l * len;
    const col = b.faction === 'player' ? '255,190,96' : '255,120,60';   // 火光色（敵偏紅）
    const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
    g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(1, `rgba(${col},0.95)`);
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // A 彈幕型（orb）：發光的球 + 短拖尾。沒有預告窗的攻擊，**彈本身就是預告**——
  // 所以它必須是畫面上最顯眼的東西之一，而且要慢到看得到、閃得掉。
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    if (!b.orb) continue;
    const l = Math.hypot(b.vx, b.vy) || 1, len = clamp(l * 0.06, 14, 60);
    const tx = b.x - b.vx / l * len, ty = b.y - b.vy / l * len;
    const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
    g.addColorStop(0, `rgba(${b.orb},0)`); g.addColorStop(1, `rgba(${b.orb},0.8)`);
    ctx.lineWidth = 4; ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    const pul = 0.85 + 0.15 * Math.sin(simTime * 18);
    ctx.fillStyle = `rgba(${b.orb},0.95)`; ctx.beginPath(); ctx.arc(b.x, b.y, 5 * pul, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,245,230,0.9)'; ctx.beginPath(); ctx.arc(b.x, b.y, 2.4 * pul, 0, Math.PI * 2); ctx.fill();
  }
  // 魔法彈（法杖）：紫青發光光矢 + 亮頭
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    if (!b.magic) continue;
    const l = Math.hypot(b.vx, b.vy) || 1, len = clamp(l * 0.05, 26, 150);
    const tx = b.x - b.vx / l * len, ty = b.y - b.vy / l * len;
    const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
    g.addColorStop(0, 'rgba(150,110,255,0)'); g.addColorStop(1, 'rgba(160,210,255,0.95)');
    ctx.lineWidth = 3; ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = 'rgba(200,225,255,0.95)'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawParticles() {
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }

/* ---- 近接可讀性：揮斬扇形 / 盾格弧 / 硬直標記（世界座標，draw() 已套 applyCam）----
   前搖＝暗色細弧「預告」揮擊範圍；判定窗＝亮色實心扇形（就是實際判定的形狀）；後搖＝淡出。 */
/* ── 攻擊預告 telegraph（AI 出手前的警示）────────────────────────────────
   規格（使用者定）：出手前放出一個「會打到哪」的形狀，由中心擴散填滿到末端，
   **填滿的瞬間＝攻擊落下的瞬間**；只對玩家視線內的敵人顯示。
   telegraphOf() 是通用接縫：現在只回近接（讀前搖進度），將來遠程加一個分支即可共用同一套視覺。 */
function telegraphOf(u) {
  if (!CONFIG.melee.tgEnabled) return null;
  if (u.id === KNIGHT_ID && u.faction === 'player') return null;   // 只跳過騎士本人；扈從照畫（FF 開著，你要看得到別站進他們的火線）
  const W = u.weapon; if (!W) return null;
  const s = u.swing;
  if (W.melee && s && s.t < s.windup) {               // 近接：前搖期間＝扇形（形狀讀**當下這一招**）
    return {
      kind: 'arc',
      p: clamp(s.t / Math.max(0.001, s.windup), 0, 1),
      reach: s.mv.reach,
      half: s.mv.arcDeg * Math.PI / 360,
    };
  }
  if (!W.melee && u.aimT > 0 && u.aimDur > 0) {       // 遠程：瞄準期間＝長方形彈道走廊（被牆截斷）
    const maxLen = Math.min(W.range, CONFIG.melee.tgBeamMaxLen);
    return {
      kind: 'beam',
      p: clamp(u.aimT / u.aimDur, 0, 1),

function drawMeleeFx(list) {
  for (const u of list) {

      const bh = CONFIG.melee.blockArcDeg * Math.PI / 360;
      const parry = (simTime - u.blockT) <= CONFIG.melee.parryWindow;
      ctx.strokeStyle = parry ? 'rgba(190,225,255,0.95)' : 'rgba(150,180,210,0.55)';
      ctx.lineWidth = parry ? 4 : 2.5;
      ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.radius + 10, u.facing - bh, u.facing + bh); ctx.stroke();

}
function drawSkeleton() {

  for (const w of MAP.walls) { ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke(); }
  ctx.strokeStyle = '#caa05a'; for (const d of MAP.doors) { if (d.open) continue; ctx.beginPath(); ctx.moveTo(d.x1, d.y1); ctx.lineTo(d.x2, d.y2); ctx.stroke(); }  // 關門也給空間參考
  ctx.strokeStyle = '#7d96b0'; ctx.lineWidth = 3; for (const lw of MAP.lowWalls) { ctx.beginPath(); ctx.moveTo(lw.x1, lw.y1); ctx.lineTo(lw.x2, lw.y2); ctx.stroke(); }

  ctx.globalAlpha = 1;
