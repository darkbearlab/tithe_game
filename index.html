/* ---- 螢幕層覆蓋：血條 / 單位標記 / 區域標記（皆保持正立）---- */
function screenBar(s, frac, col, yoff) {
  const w = 30, h = 4, x = s.x - w / 2, y = s.y + yoff;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
}
function edgeMarker(worldPos, color, label, filled) {
  const m = 24; let s = w2s(worldPos);
  const onScreen = s.x >= m && s.x <= cv.width - m && s.y >= m && s.y <= cv.height - m;
  const x = clamp(s.x, m, cv.width - m), y = clamp(s.y, m, cv.height - m);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, onScreen ? 5 : 8, 0, Math.PI * 2); filled ? ctx.fill() : ctx.stroke();
  if (label) { ctx.font = 'bold 11px Consolas'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 11); ctx.textAlign = 'left'; }
  return onScreen;
}
/* 騎士的資源條（畫面中下）——**只有一條：怒火**。
   體幹條拿掉了：騎士沒有體幹（見 CONFIG.melee 的體幹註解），而且兩條會漲會退的條擺在一起
   只會互相干擾，讀不出是誰在說話。要盯的東西只有一個，它就該是唯一的那條。
   條上那道刻痕＝大絕招門檻（`ultCost`）。**怒火不再減傷**——那條交給結晶了（CONFIG.crystal），
   兩條資源各講一件事：怒火＝你付得起什麼，結晶＝你挨得住什麼。 */
function drawKnightResources() {
  const k = knight(); if (!k || k.state === 'DEAD') return;
  const w = 240, h = 13, x = cv.width / 2 - w / 2, y = cv.height - 150;
  const bar = (yy, f, col, bg, label) => {
    ctx.fillStyle = bg; ctx.fillRect(x, yy, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, yy, w * clamp(f, 0, 1), h);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, yy + 0.5, w - 1, h - 1);
    ctx.font = '9px Consolas'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(220,230,240,0.75)';
    ctx.fillText(label, x - 6, yy + h - 1); ctx.textAlign = 'left';
  };
  const W = CONFIG.wrath;
  const wf = (k.wrath || 0) / (k.wrathMax || 1);
  const ult = (k.wrath || 0) >= W.ultCost;
  const flash = k.noWrathFxT > 0 && Math.sin(simTime * 40) > 0;
  // 大絕招就緒＝金色脈動；低怒火＝暗紅（付不起東西了）
  const wcol = flash ? '#ffffff' : ult ? `rgba(255,${200 + Math.round(40 * Math.sin(simTime * 9))},110,1)`
             : wf < 0.25 ? '#a8402f' : '#ff7a3c';
  bar(y, wf, wcol, 'rgba(12,18,26,0.8)', '怒火');
  ctx.fillStyle = 'rgba(255,214,120,0.55)'; ctx.fillRect(x + w * (W.ultCost / (k.wrathMax || 1)), y, 1, h);   // 大絕招門檻的刻痕
  // 結晶：只在有層數時才畫（沒有就不佔版面）＝一眼看得出「我現在挨得住多少」
  const cz = k.armorTemp || 0;
  if (cz > 0.001) {
    const cy = y + h + 4;
    ctx.fillStyle = 'rgba(12,18,26,0.8)'; ctx.fillRect(x, cy, w, 6);
    ctx.fillStyle = '#8fd8ff'; ctx.fillRect(x, cy, w * clamp(cz / CONFIG.crystal.cap, 0, 1), 6);
    ctx.font = '9px Consolas'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(160,215,245,0.9)';
    ctx.fillText('結晶 −' + Math.round(cz * CONFIG.armor.flatResist * 100) + '%', x - 6, cy + 6); ctx.textAlign = 'left';
  }
  if (ult) { ctx.font = 'bold 10px Consolas'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,214,120,0.95)'; ctx.fillText('Q 聖怒', x + w + 6, y + h - 1); }
  // 硬直/破防的大字提示（被定住時要非常清楚，否則玩家不知道自己為什麼不能動）
  if (k.staggerT > 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 17px Consolas';
    ctx.fillStyle = `rgba(255,190,90,${0.55 + 0.45 * Math.sin(simTime * 22)})`;
    ctx.fillText(k.guardBreakFxT > 0 ? '破防！— 怒火不夠擋' : '硬直中', cv.width / 2, y - 10);
    ctx.textAlign = 'left';
  } else if (k.noWrathFxT > 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 13px Consolas';
    ctx.fillStyle = 'rgba(255,140,90,0.9)'; ctx.fillText('怒火不足', cv.width / 2, y - 8);
    ctx.textAlign = 'left';
  }
}
/* 指令輪盤（按住 G）＋ 下令後的短暫確認提示。
   選項以滑鼠左右轉動切換（沿用 aimDir 的相對累積，不需要額外的滑鼠狀態）。 */
/* 士氣旗標（使用者要的「旗標點亮」）：動搖＝琥珀色搖晃的旗、潰逃＝紅旗+「潰逃」。
   士氣是**看得見的失敗狀態**，玩家必須讀得出來，否則行為突然改變會像是遊戲在耍你。 */
/* 拉鋸條（畫面正上方）＝這場仗的戰局。一條、一個中線，往哪邊推一眼就知道。
   刻度＝各兵種的崩潰門檻（「佔自己那半的 %」直接畫在自己那半上）。
   氣勢畫成半透明的推擠段＝看得出「這段是暫時的、會退回去」，而不是以為自己真的掉了那麼多。 */
/* 下一波的門：先亮起來、再湧出（CONFIG.waves.warn 秒）。
   §5.1 說房間沒有死角——背後無預警冒出一波是廉價的偷襲，不是難度。
   所以它畫得很吵：地面收縮的環 + 光柱 + 螢幕邊緣指標。 */
function drawWaveGate() {
  if (!wavePending) return;
  const p = clamp(1 - wavePending.t / Math.max(0.01, CONFIG.waves.warn), 0, 1);
  const a = wavePending.at;
  ctx.save();
  ctx.strokeStyle = `rgba(255,90,70,${0.35 + 0.45 * p})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(a.x, a.y, 64 * (1 - p) + 16, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = `rgba(255,150,110,${0.25 + 0.3 * Math.abs(Math.sin(simTime * 9))})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(a.x, a.y, 74, 0, Math.PI * 2); ctx.stroke();
  const g = ctx.createLinearGradient(a.x, a.y - 120, a.x, a.y);
  g.addColorStop(0, 'rgba(255,90,70,0)'); g.addColorStop(1, `rgba(255,110,80,${0.30 * (0.4 + p)})`);
  ctx.fillStyle = g; ctx.fillRect(a.x - 26, a.y - 120, 52, 120);
  ctx.restore();
}
function drawScreenOverlays() {
  // 區域標記（永遠正立、離場時夾到邊緣）
  edgeMarker(ENTRY, '#caa05a', 'ENTRY', false);
  if (wavePending) edgeMarker(wavePending.at, '#ff5a46', '援軍', true);   // 門在畫面外也要指得到
  if (exitPortalReady()) edgeMarker(exitPortal, '#ff9b5a', '出口', true);   // 洞開了：畫面邊緣指過去（清完場你可能離它很遠）

  // 我方單位：血條 + 編號（永遠可見）
  for (const p of activePlayers()) {
    const s = w2s(p.pos), low = p.hp / p.maxHp <= CONFIG.lowHpFrac;
    let col = p.hp / p.maxHp > 0.6 ? '#5fd06b' : low ? '#ff4d4d' : '#e0c24a';
    if (low && Math.sin(simTime * 18) > 0) col = '#ffffff';
    screenBar(s, p.hp / p.maxHp, col, -p.radius * cam.scale - 12);
    if (p.reloadT > 0) screenBar(s, 1 - p.reloadT / (p.reloadDur || p.weapon.reloadTime), '#7fa8ff', -p.radius * cam.scale - 2);
    ctx.font = 'bold 10px Consolas'; ctx.textAlign = 'center';
    ctx.fillStyle = (p.state === 'CONTROLLED') ? '#ffffff' : hsl(p.hue, 60, 72);
    let tag = `${p.id + 1}`;
    ctx.fillText(tag, s.x, s.y + p.radius * cam.scale + 14);
    if (p.id !== KNIGHT_ID && low) {   // 危險：血條上方大字閃爍 + 螢幕邊緣同色箭頭（下面 edgeMarker 已處理）
      ctx.font = 'bold 12px Consolas';
      ctx.fillStyle = `rgba(255,90,90,${0.55 + 0.45 * Math.sin(simTime * 12)})`;
      ctx.fillText('⚠ 重傷', s.x, s.y - p.radius * cam.scale - 26);
    }
    ctx.textAlign = 'left';
    // 離場(畫面外)的我方 → 邊緣箭頭
    edgeMarker(p.pos, hsl(p.hue, 60, 65), null, true);
  }
  // 被看到的敵人：血條
  for (const e of enemies) {
    if (e.dead) continue;
    if (!debugView && !isRevealed(e)) continue;
    const s = w2s(e.pos);
    screenBar(s, e.hp / e.maxHp, '#ff6b6b', -e.radius * cam.scale - 10);
    // 體幹條（血條下方，琥珀色）：看得出「再幾下就破」＝值不值得繼續壓
    if (e.poiseMax) {
      const f = clamp((e.poise || 0) / e.poiseMax, 0, 1);
      screenBar(s, f, f < 0.34 ? '#ffd24a' : 'rgba(210,170,90,0.85)', -e.radius * cam.scale - 5);
    }
  }
  drawKnightResources();
  // 砲塔準星（沿騎士 facing；另畫一條較淡的目標朝向線顯示轉向延遲）
  if (controlledId != null && players[controlledId].state === 'CONTROLLED') {
    const u = players[controlledId], s = w2s(u.pos);
    const r1 = u.radius * cam.scale + 6;
    const da = aimDir + cam.angle;     // 滑鼠目標朝向（螢幕角）
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(s.x + Math.cos(da) * r1, s.y + Math.sin(da) * r1); ctx.lineTo(s.x + Math.cos(da) * 120, s.y + Math.sin(da) * 120); ctx.stroke();
    const sa = u.facing + cam.angle;   // 砲塔現朝向（螢幕角）= 子彈方向
    const lineLen = isScoping() ? u.weapon.range * cam.scale : 84;   // 望遠：示意線拉長到武器射程（便於單發精準）
    ctx.strokeStyle = isScoping() ? 'rgba(127,227,255,0.7)' : 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x + Math.cos(sa) * r1, s.y + Math.sin(sa) * r1); ctx.lineTo(s.x + Math.cos(sa) * lineLen, s.y + Math.sin(sa) * lineLen); ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x + Math.cos(sa) * (lineLen + 12), s.y + Math.sin(sa) * (lineLen + 12), 4, 0, Math.PI * 2); ctx.stroke();
    if (u.sprinting) {
      ctx.fillStyle = 'rgba(127,227,255,0.9)'; ctx.font = 'bold 11px Consolas'; ctx.textAlign = 'center';
      ctx.fillText(`▸▸ SPRINT x${sprintMult().toFixed(2)}`, s.x, s.y - u.radius * cam.scale - 26);
      ctx.textAlign = 'left';
    }
    // 互動提示（在範圍內的門/按鈕/俘虜上方）
    const it = nearestInteractable(u);
    if (it) {
      const wpos = it.type === 'door' ? doorMid(it.door) : it.type === 'button' ? { x: it.button.x, y: it.button.y } : it.type === 'console' ? { x: introConsole.x, y: introConsole.y } : it.prisoner.pos;
      const ips = w2s(wpos);
      const label = it.type === 'button' ? 'F：啟動按鈕' : it.type === 'prisoner' ? (it.prisoner.kind === 'knight' ? 'F：招他入伍' : 'F：釋放俘虜') : it.type === 'console' ? 'F：取得機密檔案' : (it.door.open ? 'F：關門' : 'F：開門');
      ctx.font = 'bold 12px Consolas'; ctx.textAlign = 'center';
      const tw = ctx.measureText(label).width + 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(ips.x - tw / 2, ips.y - 30, tw, 18);
      ctx.fillStyle = '#ffe08a'; ctx.fillText(label, ips.x, ips.y - 17);
      ctx.textAlign = 'left';
    }
  }
}

/* ---- HUD（螢幕層）---- */
function drawHUD() {
  // 關卡數（左上）；名冊改以底部單位卡片呈現
  ctx.textAlign = 'left'; ctx.font = 'bold 14px Consolas'; ctx.fillStyle = '#9fb3c8';
  ctx.fillText(`MISSION ${missionIndex + 1}`, 16, 24);
  { // dash 冷卻（左上，跟著關卡數）：好了就是亮的，冷卻中畫成一條填回來的條
    const kn = knight(), D = CONFIG.dash;
    if (kn && kn.state === 'CONTROLLED') {
      const ready = (kn.dashCd || 0) <= 0, f = ready ? 1 : 1 - kn.dashCd / D.cd;
      ctx.font = '12px Consolas';
      ctx.fillStyle = ready ? '#7fe3ff' : 'rgba(127,227,255,0.45)';
      ctx.fillText('[空白] 閃避', 16, 42);
      ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(16, 47, 84, 4);
      ctx.fillStyle = ready ? '#7fe3ff' : 'rgba(127,227,255,0.6)'; ctx.fillRect(16, 47, 84 * clamp(f, 0, 1), 4);
    }
  }
  // 計數（右上）
  ctx.textAlign = 'right'; ctx.font = '13px Consolas'; ctx.fillStyle = '#cdd6e0';
  ctx.fillText(`ENEMIES ${enemies.filter(e => !e.dead).length}`, cv.width - 16, 22);
  if (drops.length || backpack.length) { ctx.fillStyle = '#ffe08a'; ctx.fillText(`BACKPACK ${backpack.length}${drops.length ? `   · 地上 ${drops.length} 件可撿` : ''}`, cv.width - 16, 40); }

  // 洞口確認框。清完場的走動很隨意，一腳踩進去就結束這一房會是最無謂的一種挫折。
  if (exitPrompt) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(6,8,12,0.72)'; ctx.fillRect(0, 0, cv.width, cv.height);
    const w = 420, h = 132, x = cv.width / 2 - w / 2, y = cv.height / 2 - h / 2;
    ctx.fillStyle = 'rgba(18,14,12,0.96)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,155,90,0.85)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#ffcd96'; ctx.font = 'bold 20px Consolas';
    ctx.fillText('跳下去？', cv.width / 2, y + 42);
    ctx.fillStyle = '#9fb3c8'; ctx.font = '13px Consolas';
    ctx.fillText('往下一層。這一房不會再回來了。', cv.width / 2, y + 70);
    ctx.font = 'bold 14px Consolas';
    ctx.fillStyle = '#ffd27a'; ctx.fillText('[Enter] 跳', cv.width / 2 - 82, y + 106);
    ctx.fillStyle = '#9fb3c8'; ctx.fillText('[Backspace/右鍵] 還沒', cv.width / 2 + 92, y + 106);

  }

     §5.5 說「單一出口讓路線規劃消失了，便宜的補法是每層開頭報一次」——
     一行字就夠，你要知道還剩多少、什麼時候該把資源留給層王。 */
  if (!introActive && !arenaMode) {
    ctx.textAlign = 'left'; ctx.font = 'bold 12px Consolas';
    ctx.fillStyle = 'rgba(200,160,110,0.9)';
    ctx.fillText(`第 ${floorNo} 層 · 第 ${roomNo}/${CONFIG.floor.rooms} 房`, 14, 22);
    if (waveTotal > 1) {
      ctx.font = '11px Consolas';
      ctx.fillStyle = wavePending ? `rgba(255,110,90,${0.6 + 0.4 * Math.abs(Math.sin(simTime * 9))})` : 'rgba(150,165,180,0.85)';
      ctx.fillText(wavePending ? `援軍逼近 ${Math.max(0, wavePending.t).toFixed(1)}s` : `第 ${waveIdx + 1}/${waveTotal} 波`, 14, 38);
    }
  }
  // 進房橫幅：進去那一刻報一次自己在哪
  if (roomBannerT > 0 && !introActive && !arenaMode) {
    const a = Math.min(1, roomBannerT / 0.6);
    ctx.textAlign = 'center'; ctx.font = 'bold 26px Consolas';
    ctx.fillStyle = `rgba(255,205,150,${0.9 * a})`;
    ctx.fillText(`第 ${floorNo} 層 · 第 ${roomNo} 房`, cv.width / 2, 96);
    ctx.font = '12px Consolas'; ctx.fillStyle = `rgba(150,130,110,${0.85 * a})`;
    ctx.fillText(`本層共 ${CONFIG.floor.rooms} 房 · 每房 ${waveTotal} 波`, cv.width / 2, 118);
    ctx.textAlign = 'left';
  }
  // 清場後的提示：洞在哪、要做什麼。刻意寫「跳下去」而不是「前往出口」——
  // 那是這個遊戲的動作（DESIGN.md §5.3：你是一路往下的）。
  if (exitPortalReady()) {
    ctx.textAlign = 'center';
    const blink = 0.72 + 0.28 * Math.sin(simTime * 4);
    ctx.fillStyle = `rgba(255,155,90,${0.16 * blink})`; ctx.fillRect(cv.width / 2 - 210, 14, 420, 30);
    ctx.fillStyle = `rgba(255,205,150,${blink})`; ctx.font = 'bold 15px Consolas';

  if (fileDrop) {
    const blink = Math.sin(simTime * 6) > -0.3;
    ctx.textAlign = 'center';
    ctx.fillStyle = blink ? 'rgba(255,180,60,0.96)' : 'rgba(255,120,60,0.96)'; ctx.font = 'bold 15px Consolas';
    ctx.fillText('⚠ 遺物已掉落 — 回收後再撤離（遺失＝歸途中斷）', cv.width / 2, 54);
    const sp = w2s(fileDrop), cx = cv.width / 2, cy = cv.height / 2;
    if (sp.x < 0 || sp.x > cv.width || sp.y < 0 || sp.y > cv.height) {   // 掉落點不在畫面內→邊框箭頭指引
      let dx = sp.x - cx, dy = sp.y - cy; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const m = 44, tx = dx > 0 ? (cv.width - m - cx) / dx : dx < 0 ? (m - cx) / dx : Infinity, ty = dy > 0 ? (cv.height - m - cy) / dy : dy < 0 ? (m - cy) / dy : Infinity;
      const t = Math.min(tx, ty), ex = cx + dx * t, ey = cy + dy * t;
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(Math.atan2(dy, dx));
      ctx.fillStyle = 'rgba(255,210,125,0.96)'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-9, -10); ctx.lineTo(-9, 10); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.fillStyle = 'rgba(255,210,125,0.96)'; ctx.font = 'bold 10px Consolas'; ctx.fillText('檔案', ex - dx * 24, ey - dy * 24);
    }
    ctx.textAlign = 'left';
  }

  // 密封容器：攜帶中提示（資訊色，非必須） + 地上未回收的邊框箭頭（比照機密檔案，可再撿）
  const carryingCaches = activePlayers().reduce((n, p) => n + (p.caches || 0), 0);
  if (carryingCaches > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(120,220,235,0.92)'; ctx.font = 'bold 13px Consolas';
    ctx.fillText('📦 密封容器 ×' + carryingCaches + '（帶著撤離才會開封）', cv.width / 2, 74); ctx.textAlign = 'left';
  }
  if (cacheGround.length) {

// 受擊回饋：回傳這一幀要套用的震動位移（同時給紅框強度）
function cardShakeOf(p) {

  const f = clamp(t / CONFIG.juice.cardHit, 0, 1);

// 受擊紅框（騎士與扈從共用）

function drawCard(p, x, y, w, h, i) {

  } else {
    ctx.fillStyle = inactive ? '#6a727c' : (p.ammoInMag <= 5 ? '#ff7d7d' : '#cdd6e0');
    ctx.fillText(`${p.ammoInMag}/${p.magazine || W.magazine} (${p.ammoReserve})`, x + w - pad, y + 59);
  }

  if (!inactive) {

  ctx.textAlign = 'left';
}

// 武器強化摘要（配裝卡/鐵匠共用）：★精良度＋鋒利/平衡/詞條
function enhSummary(id, quality, enh) {
  const q = quality != null ? quality : qualityOf(id);
  const used = (enh || []).reduce((n, e) => n + (e.charges || 1), 0);
  let parts = [];
  for (const e of (enh || [])) {
    if (e.kind === 'sharp') parts.push('鋒利+' + e.value);
    else if (e.kind === 'balance') parts.push('平衡−' + e.value);
    else if (e.kind === 'affix') parts.push((AFFIXES[e.affix] ? AFFIXES[e.affix].name : e.affix));
  }
  return { stars: '★'.repeat(q), free: q - used, used, parts };
}

/* 限時外框：從畫面頂端中央出發、**順時針**沿著邊框消失。
   高對比（白→紅）而且畫在最外緣＝不擋任何內容，但你絕對看得到它在縮。 */
function drawDescentClock(f) {
  const w = cv.width, h = cv.height, cx = w / 2;
  const segs = [   // 順時針走一圈：上半右 → 右 → 下 → 左 → 上半左
    [cx, 0, w, 0], [w, 0, w, h], [w, h, 0, h], [0, h, 0, 0], [0, 0, cx, 0],
  ];
  const lens = segs.map(([x0, y0, x1, y1]) => Math.hypot(x1 - x0, y1 - y0));
  let left = lens.reduce((a, b) => a + b, 0) * clamp(f, 0, 1);
  const urgent = f < 0.25;
  ctx.save();
  ctx.lineWidth = urgent ? 10 : 7; ctx.lineCap = 'butt';
  ctx.strokeStyle = urgent ? `rgba(255,70,60,${0.75 + 0.25 * Math.abs(Math.sin(simTime * 10))})` : 'rgba(255,240,220,0.92)';
  for (let i = 0; i < segs.length && left > 0; i++) {
    const [x0, y0, x1, y1] = segs[i], L = lens[i];
    const t = Math.min(1, left / L); left -= L;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t); ctx.stroke();
  }
  ctx.restore();
}

function drawRoadmap() {
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.fillStyle = hsl(110, 55, 55); ctx.fillText('⚔ 前哨站', cv.width / 2 - 110, 102);
  ctx.fillStyle = hsl(190, 60, 55); ctx.fillText('⚔ 雙線哨廊', cv.width / 2 - 10, 102);

  ctx.fillStyle = hsl(150, 60, 55); ctx.fillText('＋ 休息', cv.width / 2 + 230, 102);

  // 頂部橫幅堆疊：翻面（紅）＋戰後獎勵（綠）＋ S3 護送團聚/錯過（金）；皆 selectNode 清掉。護送中則常駐提示。
  let by = 120;

    ctx.fillStyle = 'rgba(48,20,20,0.94)'; ctx.fillRect(cv.width / 2 - 400, by - 15, 800, 28);
    ctx.strokeStyle = 'rgba(255,120,110,0.75)'; ctx.lineWidth = 1.5; ctx.strokeRect(cv.width / 2 - 400, by - 15, 800, 28);
    ctx.fillStyle = '#ff9a8a'; ctx.font = 'bold 14px Consolas'; ctx.fillText(actMsg, cv.width / 2, by + 4); by += 34;
  }
  if (missionMsg) { ctx.fillStyle = '#8fe3a0'; ctx.font = 'bold 14px Consolas'; ctx.fillText('⚔ ' + missionMsg, cv.width / 2, by); by += 22; }
  if (escortMsg) {
    ctx.fillStyle = 'rgba(40,34,20,0.92)'; ctx.fillRect(cv.width / 2 - 380, by - 14, 760, 26);
    ctx.strokeStyle = 'rgba(255,210,125,0.7)'; ctx.lineWidth = 1.4; ctx.strokeRect(cv.width / 2 - 380, by - 14, 760, 26);
    ctx.fillStyle = '#ffd27d'; ctx.font = '13px Consolas'; ctx.fillText(escortMsg, cv.width / 2, by + 4);
  } else if (runEscort && !missionMsg) {
    ctx.fillStyle = '#ffd27d'; ctx.font = '12px Consolas'; ctx.fillText('⚑ 護送中：帶男孩到標記的會合點（走岔了他會跟丟）', cv.width / 2, by);
  }

  const avail = roadAvailable.filter(id => !roadCompleted.has(id));
  // 邊
  for (const [a, b] of roadmap.edges) {
    const pa = roadNodePos(roadNode(a)), pb = roadNodePos(roadNode(b));
    const hot = roadCompleted.has(a) || avail.includes(a) || avail.includes(b);
    ctx.strokeStyle = hot ? 'rgba(160,190,220,0.45)' : 'rgba(120,140,160,0.14)';
    ctx.lineWidth = hot ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  // 節點
  for (const n of roadmap.nodes) {
    const p = roadNodePos(n);
    const done = roadCompleted.has(n.id), isAvail = avail.includes(n.id);
    const hover = isAvail && Math.hypot(mouse.mx - p.x, mouse.my - p.y) <= 26;
    const isBravo = n.type === 'COMBAT' && (n.map === 'bravo');
    const isOutpost = n.type === 'COMBAT' && (n.map === 'outpost');
    const isLanes = n.type === 'COMBAT' && (n.map === 'lanes');
    const base = n.type === 'REST' ? 150 : n.type === 'ARMORY' ? 48 : n.type === 'EVENT' ? 280 : (isBravo ? 35 : isOutpost ? 110 : isLanes ? 190 : 8);   // hue: 開闊紅、門禁橙、前哨綠、哨廊藍、軍械庫金、休息青、事件紫
    let fill, stroke;
    if (done) { fill = 'rgba(70,80,90,0.5)'; stroke = 'rgba(120,130,140,0.6)'; }
    else if (isAvail) { fill = hsl(base, 65, hover ? 52 : 42); stroke = '#ffffff'; }
    else { fill = hsl(base, 30, 22); stroke = hsl(base, 30, 35); }
    if (n.boss && !done) { ctx.strokeStyle = 'rgba(255,80,80,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 33, 0, Math.PI * 2); ctx.stroke(); }   // 王＝紅圈標示
    if (isAvail) { const a = 0.4 + 0.4 * Math.sin(simTime ? simTime * 5 : 0); ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p.x, p.y, hover ? 24 : 22, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = isAvail ? 2.5 : 1.5; ctx.strokeStyle = stroke; ctx.beginPath(); ctx.arc(p.x, p.y, hover ? 24 : 22, 0, Math.PI * 2); ctx.stroke();
    // 休息節點：**內容進入才揭曉**（已去過 or 斥候探明才顯示真實 site；否則一律「休整地」）

    const sub = n.boss ? (n.bossName || ACT_INFO[roadmap.act || 1].boss) : n.type === 'REST' ? (restKnown ? REST_SITES[siteOf(n)].name : '休整地') : n.type === 'ARMORY' ? '軍械庫' : n.type === 'EVENT' ? '事件' : (MAPS[n.map] || MAPS.alpha).label;
    ctx.fillStyle = done ? '#aab' : '#ffffff'; ctx.font = 'bold 16px Consolas';
    ctx.fillText(glyph, p.x, p.y + 6);
    ctx.fillStyle = isAvail ? '#e8eef5' : 'rgba(180,190,200,0.6)'; ctx.font = '11px Consolas';
    ctx.fillText(sub, p.x, p.y + 38);
    // S3 護送：團聚點記號（金色虛線環 + ⚑ + 「會合」）
    if (runEscort && n.id === runEscort.markNodeId && !done) {
      ctx.strokeStyle = 'rgba(255,210,125,0.9)'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 29, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ffd27d'; ctx.font = 'bold 15px Consolas'; ctx.fillText('⚑', p.x, p.y - 30);
      ctx.font = '10px Consolas'; ctx.fillText('會合', p.x, p.y - 44);
    }
  }

  // 現有陣容（底部）
  ctx.fillStyle = '#cdd6e0'; ctx.font = '13px Consolas'; ctx.textAlign = 'left'; ctx.fillText('陣容:', 24, cv.height - 92);
  const cw = 200, gap = 10;
  roster.slice(0, 6).forEach((r, i) => drawRosterCard(r, 24 + i * (cw + gap), cv.height - 84, cw, 76, i));

}

/* =====================================================================
   Main loop
   ===================================================================== */
const FIXED = 1 / 60;
let acc = 0, last = performance.now();
function frame(now) {
  let delta = (now - last) / 1000; last = now;
  if (delta > 0.25) delta = 0.25;
  if (hitstopT > 0) { hitstopT -= delta; }          // 頓幀：凍結模擬、畫面續繪（不快轉補回）＝擊殺/我方陣亡的「頓一下」
  else {
    acc += delta;
    while (acc >= FIXED) { update(FIXED); acc -= FIXED; }
  }
  if (scene === 'ENDING') endingTick(delta);   // 結局/揭示逐行出（非 COMBAT，update 不跑，這裡用真實 delta 計時）
  if (scene === 'DESCENT') tickDescent(delta);   // 整備倒數（同理：非 COMBAT，update 不跑）
  draw();
  drawSeedTag();   // 角落淡色顯示本局種子（疊在所有場景之上）
  requestAnimationFrame(frame);
}

// 開機：主選單為進入點；?sandbox 直接自由戰鬥；?playtest 由編輯器帶圖進自由戰鬥設定
function bootPlaytest() {
  let s = null; try { s = localStorage.getItem('homeward_playtest'); } catch (e) {}
  if (s) { pendingPlaytestMap = s; playtestMode = true; enterSandbox(); } else goMenu();
}
loadMeta();   // 載入局外進度（解鎖/榮譽）
let __q = ''; try { __q = (typeof location !== 'undefined' && location.search) || ''; } catch (e) {}
// 開機預設進主選單（MVP）。試作場收在主選單的「開發／測試」子選單，或用 `?arena=melee|ranged` 直達。
if (/[?&]playtest\b/.test(__q)) bootPlaytest();
else if (/[?&]sandbox\b/.test(__q) && sandboxEl) enterSandbox();
else { const am = /[?&]arena=(\w+)/.exec(__q); if (am && ARENA_MODES[am[1]]) enterArena(am[1]); else goMenu(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
